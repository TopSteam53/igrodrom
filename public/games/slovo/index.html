<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% -20%,#22605b 0%,#133d40 45%,#0a2127 100%);color:#eafaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit;padding:0;background:none}

.ib{height:100%;aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:background .15s,transform .1s}
.ib:hover{background:rgba(255,255,255,.14)}
.ib:active{transform:translateY(2px)}
.ib svg{width:52%;height:52%}
#seg{height:100%;display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:4px;gap:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
#seg button{border-radius:999px;padding:0 calc(var(--hh)*.32);font-weight:800;font-size:calc(var(--hh)*.33);color:#9cc9c2;white-space:nowrap;transition:color .2s,background .2s}
#seg button.on{background:linear-gradient(135deg,#3fe08d,#14a7a0);color:#062b25;box-shadow:0 3px 10px rgba(30,220,150,.35),inset 0 -2px 0 rgba(0,0,0,.18)}
#main{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--gap2);width:100%;min-height:0}
#main.land{flex-direction:row}
#main.port{flex-direction:column;justify-content:space-between;padding:var(--pad) 0}
#gridWrap{position:relative;flex:none}
#main.port #gridWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#grid{display:grid;grid-template-columns:repeat(var(--len,5),var(--tile));grid-auto-rows:var(--tile);gap:var(--tg)}
.t{position:relative;border-radius:calc(var(--tile)*.14);perspective:400px}
.t .f{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--tile)*.52);text-transform:uppercase;background:rgba(255,255,255,.035);border:2px solid rgba(255,255,255,.13);transition:border-color .1s}
.t.fill .f{border-color:rgba(190,255,240,.5);background:rgba(255,255,255,.08)}
.t.pop .f{animation:pop .12s ease-out}
@keyframes pop{50%{transform:scale(1.12)}}
.t.c .f,.t.p .f,.t.a .f{border-color:transparent;box-shadow:inset 0 calc(var(--tile)*-.07) 0 rgba(0,0,0,.18)}
.t.c .f{background:linear-gradient(160deg,#4fe58f,#17a85a);color:#fff;text-shadow:0 2px 0 rgba(0,70,30,.35)}
.t.p .f{background:linear-gradient(160deg,#ffd866,#f2a524);color:#4a2a00}
.t.a .f{background:linear-gradient(160deg,#4a5d66,#36474f);color:#c9d6db}
.t.flip .f{animation:flip .5s ease-in-out}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.t.win .f{animation:bounce .5s ease-out}
#clue{margin:10px 0 0;max-width:calc(var(--tile) * var(--len,5) + var(--tg) * 4);color:#a9d5cd;font-size:15px;line-height:1.35;text-align:center}
#main.port #gridWrap{flex-direction:column}
.t.ghost .f{color:rgba(255,216,102,.6);border:2px dashed rgba(255,216,102,.6)}
#lenBtn{width:auto;aspect-ratio:auto;padding:0 12px;font-weight:900;font-size:calc(var(--hh)*.34);gap:4px}
#lenBtn small{font-size:.7em;color:#9cc9c2}
#lenBtn:disabled{opacity:.35}
@media (max-width:520px){#top{gap:5px}#seg button{padding:0 9px;font-size:13px}#lenBtn{padding:0 8px}#lenBtn small{display:none}}
#hintBtn:disabled{opacity:.35}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-35%)}70%{transform:translateY(6%)}}
.row-shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#toast{position:fixed;left:50%;top:calc(var(--hh) + var(--pad)*3 + var(--tile)*.3);z-index:30;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:90vw}
.msg{background:#f4fffb;color:#0b2a26;font-weight:800;font-size:15px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease-out;text-align:center}
.msg.out{opacity:0;transition:opacity .3s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#kb{position:relative;width:var(--kbw);display:flex;flex-direction:column;gap:var(--kg);flex:none}
.kr{display:flex;justify-content:center;gap:var(--kg)}
.k{width:var(--kw);height:var(--kh);border-radius:calc(var(--kw)*.18);background:linear-gradient(180deg,#5f8a8d,#4b7376);color:#fff;font-weight:800;font-size:calc(min(var(--kw)*.5,var(--kh)*.42));text-transform:uppercase;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);transition:background .25s,transform .06s}
.k:active,.k.down{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.22)}
.k.w{width:calc(var(--kw)*1.5 + var(--kg)*.5);font-size:calc(min(var(--kw)*.34,var(--kh)*.3))}
.k.w svg{width:55%;height:55%}
.k.c{background:linear-gradient(180deg,#43dc85,#18a85a)}
.k.p{background:linear-gradient(180deg,#ffd257,#efa223);color:#4a2a00}
.k.a{background:linear-gradient(180deg,#34444b,#2a383e);color:#7f949b}

#done.show{display:flex}
#doneT{font-weight:900;font-size:calc(var(--kh)*.44)}
#doneS{font-size:calc(var(--kh)*.3);color:#a9d5cd;font-variant-numeric:tabular-nums}

.bt.alt:active{box-shadow:0 1px 0 #173235}

.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:14px}
.nums b{display:block;font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.nums small{font-size:12px;color:#a9d5cd;line-height:1.2;display:block}

.dr{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}

var CLUED=Object.keys(CLUES);
CLUED.forEach(function(w){if(w.length===5)ALLOWED.add(w)});
var ANSWERS_BY={5:CLUED.filter(function(w){return w.length===5}),6:CLUED.filter(function(w){return w.length===6}),7:CLUED.filter(function(w){return w.length===7})};
// Если у слова нет загадки — косвенная подсказка по составу слова.
function clueFor(w){
  if(CLUES[w])return CLUES[w];
  var v=0;for(var i=0;i<w.length;i++)if(VOWELS.indexOf(w[i])>=0)v++;
  return 'В слове '+v+' гласных, оно '+(VOWELS.indexOf(w[0])>=0?'начинается с гласной':'начинается с согласной')+' и заканчивается на «'+w[w.length-1].toUpperCase()+'»';
}
var ROWS=6,LEN=5,root=document.documentElement;
var VOWELS='аеиоуыэюя';
// Для 6–7 букв полного словаря нет: принимаем слова из списка или похожие на настоящие (есть гласные, нет тройных повторов).
function looksLikeWord(w){
  if(!/^[а-я]+$/.test(w)||/^[ъьы]/.test(w)||/(.)\1\1/.test(w))return false;
  var v=0;for(var i=0;i<w.length;i++)if(VOWELS.indexOf(w[i])>=0)v++;
  return v>=2&&v<w.length-1;
}
function isAllowed(w){return w.length===5?ALLOWED.has(w):(ANSWERS_BY[w.length]||[]).indexOf(w)>=0||looksLikeWord(w)}
var LEN_WORD={5:'пяти',6:'шести',7:'семи'};
var gridEl=document.getElementById('grid'),kbEl=document.getElementById('kb'),mainEl=document.getElementById('main');
var toastEl=document.getElementById('toast'),modal=document.getElementById('modal'),card=document.getElementById('card');
var doneEl=document.getElementById('done'),doneT=document.getElementById('doneT'),doneS=document.getElementById('doneS');
var tiles=[],keys={};

// ---------- данные ----------
function emptyStats(){return {played:0,wins:0,streak:0,maxStreak:0,dist:[0,0,0,0,0,0],last:0}}
var st={mode:'daily',daily:null,free:null,stats:emptyStats(),recent:[],help:false,len:5,hints:0};
var cur='',busy=false,paused=false,touched=false,sdk=null;

function pad2(n){return (n<10?'0':'')+n}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function dayNum(key){var p=key.split('-');return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(2026,0,1))/864e5)}
function dailyWord(key){var A=ANSWERS_BY[5],n=A.length,i=((dayNum(key)*7)%n+n)%n;return A[i]}
function fmtDate(key){var p=key.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function newDaily(){var k=todayKey();return {date:k,answer:dailyWord(k),guesses:[],done:false,won:false}}
function newFree(){
  var daily=dailyWord(todayKey()),list=ANSWERS_BY[st.len]||ANSWERS,w,tries=0;
  do{w=list[Math.random()*list.length|0];tries++}while((w===daily||st.recent.indexOf(w)>=0)&&tries<200);
  st.recent.push(w);if(st.recent.length>200)st.recent.splice(0,st.recent.length-200);
  return {answer:w,guesses:[],done:false,won:false,hints:[]};
}
function game(){return st[st.mode]}

function save(){
  if(!sdk)return;
  sdk.data.set({v:1,mode:st.mode,daily:st.daily,free:st.free,stats:st.stats,recent:st.recent,help:st.help,cur:cur,len:st.len,hints:st.hints}).catch(function(){});
}
function num(v,max){return typeof v==='number'&&isFinite(v)&&v>=0?Math.min(Math.floor(v),max||1e9):0}
function validGame(g,needAnswer){
  if(!g||typeof g!=='object'||typeof g.answer!=='string'||!Array.isArray(g.guesses)||g.guesses.length>ROWS)return null;
  var n=g.answer.length;
  if(!ANSWERS_BY[n]||(needAnswer&&ANSWERS_BY[n].indexOf(g.answer)<0))return null;
  for(var i=0;i<g.guesses.length;i++)if(typeof g.guesses[i]!=='string'||g.guesses[i].length!==n||!/^[а-я]+$/.test(g.guesses[i]))return null;
  var last=g.guesses[g.guesses.length-1],won=last===g.answer,done=won||g.guesses.length===ROWS;
  var hints=Array.isArray(g.hints)?g.hints.filter(function(x){return x===(x|0)&&x>=0&&x<n}):[];
  return {answer:g.answer,guesses:g.guesses.slice(),done:done,won:won,date:g.date,hints:hints,clue:g.clue===true};
}
function applySave(d){
  if(!d||typeof d!=='object'||d.v!==1)return false;
  var s=d.stats;
  if(s&&typeof s==='object'){
    var ns=emptyStats();
    ns.played=num(s.played);ns.wins=Math.min(num(s.wins),ns.played);ns.streak=num(s.streak);ns.maxStreak=Math.max(num(s.maxStreak),ns.streak);ns.last=num(s.last,6);
    if(Array.isArray(s.dist)&&s.dist.length===6)ns.dist=s.dist.map(function(x){return num(x)});
    st.stats=ns;
  }
  if(Array.isArray(d.recent))st.recent=d.recent.filter(function(w){return typeof w==='string'}).slice(-120);
  st.help=d.help===true;
  if(d.len===6||d.len===7)st.len=d.len;
  st.hints=num(d.hints,99);
  if(touched)return true;
  var dl=validGame(d.daily,false);
  if(dl&&dl.date===todayKey()&&dl.answer===dailyWord(dl.date))st.daily=dl;
  var fr=validGame(d.free,true);
  if(fr)st.free=fr;
  st.mode=d.mode==='free'&&st.free?'free':'daily';
  if(!st.daily)st.daily=newDaily();
  cur=typeof d.cur==='string'&&/^[а-я]{0,7}$/.test(d.cur)&&d.cur.length<=game().answer.length&&!game().done?d.cur:'';
  return true;
}

// ---------- проверка слова ----------
function evaluate(g,a){
  var res=[],left={},i;
  for(i=0;i<LEN;i++)res.push('a');
  for(i=0;i<LEN;i++){if(g[i]===a[i])res[i]='c';else left[a[i]]=(left[a[i]]||0)+1}
  for(i=0;i<LEN;i++){if(res[i]!=='c'&&left[g[i]]>0){res[i]='p';left[g[i]]--}}
  return res;
}

// ---------- раскладка ----------
var KB_ROWS=['йцукенгшщзхъ','фывапролджэ','>ячсмитьбю<'];
function layout(){
  var W=window.innerWidth,H=window.innerHeight;
  var pad=W<380||H<420?6:10;
  var hh=Math.round(Math.max(34,Math.min(50,H*.065)));
  var land=W>H*1.3&&H<640;
  var tg,tile,kbw,kg,kw,kh,gap2;
  var avH=H-hh-pad*3-(document.getElementById('clue').classList.contains('hidden')?0:48);
  if(land){
    tg=Math.max(4,Math.round(avH*.012));
    tile=Math.floor(Math.min((avH-5*tg)/6,70));
    var gw=tile*LEN+tg*(LEN-1);
    gap2=Math.max(14,Math.round(W*.03));
    kbw=Math.min(W-gw-gap2-pad*2,620);
    kg=Math.max(3,Math.round(kbw*.011));
    kw=(kbw-11*kg)/12;
    kh=Math.min(kw*1.4,(avH-2*kg)/3*.72,60);
  }else{
    kbw=Math.min(W-pad*2,600);
    kg=Math.max(3,Math.round(kbw*.011));
    kw=(kbw-11*kg)/12;
    kh=Math.max(34,Math.min(kw*1.45,H*.078,62));
    var kbH=kh*3+kg*2;
    gap2=pad;
    tg=Math.max(4,Math.round(Math.min(W,H)*.012));
    tile=Math.floor(Math.min((avH-kbH-gap2*2-5*tg)/6,(W-pad*2-(LEN-1)*tg)/LEN,70));
  }
  tile=Math.max(26,tile);
  mainEl.className=land?'land':'port';
  var gw2=tile*LEN+tg*(LEN-1),tw=Math.min(W-pad*2,land?gw2+gap2+kbw:Math.max(kbw,gw2));
  var r=root.style;
  r.setProperty('--pad',pad+'px');r.setProperty('--hh',hh+'px');r.setProperty('--tw',tw+'px');
  r.setProperty('--tile',tile+'px');r.setProperty('--len',LEN);r.setProperty('--tg',tg+'px');r.setProperty('--gap2',gap2+'px');
  r.setProperty('--kbw',kbw+'px');r.setProperty('--kg',kg+'px');r.setProperty('--kw',kw+'px');r.setProperty('--kh',kh+'px');
}

// Поле под длину слова: пересобирается, когда меняется длина.
function setLen(n){
  if(n===LEN&&tiles.length)return;
  LEN=n;gridEl.innerHTML='';tiles=[];
  for(var i=0;i<ROWS*LEN;i++){
    var t=document.createElement('div');t.className='t';t.appendChild(document.createElement('div')).className='f';
    gridEl.appendChild(t);tiles.push(t);
  }
  layout();
}
function build(){
  setLen(LEN);
  KB_ROWS.forEach(function(row){
    var r=document.createElement('div');r.className='kr';
    row.split('').forEach(function(ch){
      var b=document.createElement('button');b.className='k';b.tabIndex=-1;
      if(ch==='>'){b.className='k w';b.textContent='Ввод';b.dataset.k='enter';b.setAttribute('aria-label','Проверить слово')}
      else if(ch==='<'){b.className='k w';b.dataset.k='back';b.setAttribute('aria-label','Стереть букву');
        b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5m0-5l-5 5"/></svg>'}
      else{b.textContent=ch;b.dataset.k=ch;keys[ch]=b}
      r.appendChild(b);
    });
    kbEl.appendChild(r);
  });
  kbEl.addEventListener('mousedown',function(e){e.preventDefault()});
  kbEl.addEventListener('click',function(e){
    var b=e.target.closest('.k');if(!b)return;
    var k=b.dataset.k;
    if(k==='enter')submit();else if(k==='back')back();else type(k);
  });
}

// ---------- отрисовка ----------
function tileAt(r,c){return tiles[r*LEN+c]}
function setTile(t,ch,cls){t.className='t'+(ch?' fill':'')+(cls?' '+cls:'');t.firstChild.textContent=ch||''}
function ghost(c){var g=game();return !cur[c]&&g.hints&&g.hints.indexOf(c)>=0?g.answer[c]:''}
function paintCell(r,c){var g=game();if(r!==g.guesses.length)return;var gh=ghost(c);setTile(tileAt(r,c),cur[c]||gh,gh&&!cur[c]?'ghost':'')}
function renderBoard(){
  var g=game();
  setLen(g.answer.length);
  for(var r=0;r<ROWS;r++){
    var w=g.guesses[r],ev=w?evaluate(w,g.answer):null;
    for(var c=0;c<LEN;c++){
      if(w)setTile(tileAt(r,c),w[c],ev[c]);
      else if(r===g.guesses.length)paintCell(r,c);
      else setTile(tileAt(r,c),'');
    }
  }
  renderKeys();renderDone();renderSeg();
}
function renderKeys(){
  var g=game(),best={},rank={a:1,p:2,c:3};
  g.guesses.forEach(function(w){var ev=evaluate(w,g.answer);for(var i=0;i<LEN;i++){var s=ev[i];if(!best[w[i]]||rank[s]>rank[best[w[i]]])best[w[i]]=s}});
  for(var ch in keys)keys[ch].className='k'+(best[ch]?' '+best[ch]:'');
}
function renderSeg(){
  document.getElementById('mDaily').classList.toggle('on',st.mode==='daily');
  document.getElementById('mFree').classList.toggle('on',st.mode==='free');
  var lb=document.getElementById('lenBtn');
  lb.innerHTML=(st.mode==='free'?st.len:5)+'<small>букв</small>';lb.disabled=st.mode!=='free';
  var g=game(),free=!(g.hints&&g.hints.length);
  var ce=document.getElementById('clue'),show=!!g.clue,was=!ce.classList.contains('hidden');
  ce.classList.toggle('hidden',!show);
  if(show)ce.textContent=clueFor(g.answer);
  if(show!==was)layout();
  document.getElementById('hintBtn').disabled=g.done;
}
var tick=null;
function untilMidnight(){
  var n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((m-n)/1000));
  return pad2(s/3600|0)+':'+pad2((s%3600)/60|0)+':'+pad2(s%60);
}
function renderDone(){
  var g=game();
  if(!g.done){doneEl.classList.remove('show');return}
  doneEl.classList.add('show');
  doneT.textContent=g.won?(st.mode==='daily'?'Слово дня разгадано!':'Слово разгадано!'):'Было слово: '+g.answer.toUpperCase();
  doneS.textContent=st.mode==='daily'?'Новое слово через '+untilMidnight():g.won?'Угадано с '+g.guesses.length+'-й попытки':'Не беда, попробуйте следующее';
}
setInterval(function(){
  if(st.mode==='daily'&&st.daily&&st.daily.date!==todayKey()&&!busy){st.daily=newDaily();cur='';renderBoard();save()}
  if(doneEl.classList.contains('show'))renderDone();
  var nx=document.getElementById('nextT');if(nx)nx.textContent=untilMidnight();
},1000);

function toast(text,ms){
  var m=document.createElement('div');m.className='msg';m.textContent=text;
  while(toastEl.children.length>2)toastEl.firstChild.remove();
  toastEl.appendChild(m);
  setTimeout(function(){m.classList.add('out');setTimeout(function(){m.remove()},300)},ms||1400);
}

// ---------- ввод ----------
function canType(){return !busy&&!paused&&!modal.classList.contains('show')&&!game().done}
function type(ch){
  if(!canType()||cur.length>=LEN)return;
  cur+=ch;
  var t=tileAt(game().guesses.length,cur.length-1);
  setTile(t,ch,'');void t.offsetWidth;t.classList.add('pop');
  flash(ch);
}
function back(){
  if(!canType()||!cur.length)return;
  cur=cur.slice(0,-1);
  paintCell(game().guesses.length,cur.length);
  flash('back');
}
function flash(k){
  var b=k==='back'?kbEl.querySelector('[data-k=back]'):keys[k];if(!b)return;
  b.classList.add('down');setTimeout(function(){b.classList.remove('down')},90);
}
function shakeRow(r){
  for(var c=0;c<LEN;c++){var t=tileAt(r,c);t.classList.remove('row-shake');void t.offsetWidth;t.classList.add('row-shake')}
}
var WIN_MSG=['Гениально!','Великолепно!','Потрясающе!','Отлично!','Хорошо!','Уф, успели!'];
function submit(){
  if(!canType())return;
  var g=game(),r=g.guesses.length;
  if(cur.length<LEN){shakeRow(r);toast('Нужно слово из '+LEN_WORD[LEN]+' букв');return}
  if(!isAllowed(cur)){shakeRow(r);toast('Такого слова нет в словаре');return}
  var w=cur,ev=evaluate(w,g.answer);
  g.guesses.push(w);cur='';touched=true;busy=true;
  var won=w===g.answer,lost=!won&&g.guesses.length===ROWS;
  if(won||lost){g.done=true;g.won=won;record(won,g.guesses.length)}
  save();
  for(var c=0;c<LEN;c++)(function(c){
    var t=tileAt(r,c);
    setTimeout(function(){t.classList.add('flip');setTimeout(function(){setTile(t,w[c],ev[c]+' flip')},250)},c*260);
  })(c);
  setTimeout(function(){
    for(var c=0;c<LEN;c++)tileAt(r,c).classList.remove('flip');
    renderKeys();busy=false;
    if(won){
      toast(WIN_MSG[r],1800);
      for(var c2=0;c2<LEN;c2++)(function(c2){setTimeout(function(){tileAt(r,c2).classList.add('win')},c2*90)})(c2);
      confetti();
      setTimeout(function(){renderDone();showStats(true)},1600);
    }else if(lost){
      toast(g.answer.toUpperCase(),2600);
      setTimeout(function(){renderDone();showStats(true)},1500);
    }
  },LEN*260+300);
}
function record(won,n){
  var s=st.stats;s.played++;
  if(won){s.wins++;s.streak++;s.maxStreak=Math.max(s.maxStreak,s.streak);s.dist[n-1]++;s.last=n}
  else{s.streak=0;s.last=0}
}

var CODE={KeyQ:'й',KeyW:'ц',KeyE:'у',KeyR:'к',KeyT:'е',KeyY:'н',KeyU:'г',KeyI:'ш',KeyO:'щ',KeyP:'з',BracketLeft:'х',BracketRight:'ъ',KeyA:'ф',KeyS:'ы',KeyD:'в',KeyF:'а',KeyG:'п',KeyH:'р',KeyJ:'о',KeyK:'л',KeyL:'д',Semicolon:'ж',Quote:'э',KeyZ:'я',KeyX:'ч',KeyC:'с',KeyV:'м',KeyB:'и',KeyN:'т',KeyM:'ь',Comma:'б',Period:'ю',Backquote:'е'};
var LAT={q:'й',w:'ц',e:'у',r:'к',t:'е',y:'н',u:'г',i:'ш',o:'щ',p:'з','[':'х',']':'ъ',a:'ф',s:'ы',d:'в',f:'а',g:'п',h:'р',j:'о',k:'л',l:'д',';':'ж',"'":'э',z:'я',x:'ч',c:'с',v:'м',b:'и',n:'т',m:'ь',',':'б','.':'ю','`':'е'};
window.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target&&e.target.id==='shareTxt')return;
  if(modal.classList.contains('show')){
    if(e.key==='Escape'){e.preventDefault();closeModal()}
    else if(e.key==='Enter'){e.preventDefault();var nb=card.querySelector('[data-enter]');if(nb)nb.click();else closeModal()}
    return;
  }
  if(e.key==='Enter'){e.preventDefault();if(game().done)nextWord();else submit();return}
  if(e.key==='Backspace'){e.preventDefault();back();return}
  var k=(e.key||'').toLowerCase(),ch=null;
  if(/^[а-яё]$/.test(k))ch=k==='ё'?'е':k;
  else if(CODE[e.code])ch=CODE[e.code];
  else if(LAT[k])ch=LAT[k];
  if(ch){e.preventDefault();type(ch)}
});

// ---------- режимы ----------
function setMode(m){
  if(busy||st.mode===m)return;
  if(cur){cur=''}
  st.mode=m;
  if(m==='daily'&&(!st.daily||st.daily.date!==todayKey()))st.daily=newDaily();
  if(m==='free'&&!st.free)st.free=newFree();
  renderBoard();save();
}
var adBusy=false;
function nextWord(){
  if(busy||adBusy)return;
  closeModal();
  var startNew=function(){st.mode='free';st.free=newFree();cur='';renderBoard();save()};
  if(st.mode==='daily'&&st.free&&!st.free.done){setMode('free');return}
  if(sdk){
    adBusy=true;
    sdk.ads.fullscreen().catch(function(){}).then(function(){adBusy=false;startNew()});
  }else startNew();
}
document.getElementById('mDaily').addEventListener('click',function(){setMode('daily')});
document.getElementById('mFree').addEventListener('click',function(){if(st.mode==='free'&&st.free&&st.free.done)nextWord();else setMode('free')});
document.getElementById('doneNext').addEventListener('click',nextWord);
document.getElementById('doneStats').addEventListener('click',function(){showStats(true)});
document.getElementById('statsBtn').addEventListener('click',function(){showStats(false)});
document.getElementById('helpBtn').addEventListener('click',showHelp);

// Длина слова в свободной игре: 5 → 6 → 7. Текущее слово без попыток сразу меняется на новое.
document.getElementById('lenBtn').addEventListener('click',function(){
  if(st.mode!=='free'||busy)return;
  st.len=st.len===7?5:st.len+1;
  if(!st.free||st.free.done||!st.free.guesses.length){st.free=newFree();cur='';renderBoard()}
  else{renderSeg();toast('Слова из '+st.len+' букв — со следующего слова')}
  save();
});

// Подсказка: открывает букву на её месте. Первая в слове бесплатно, дальше — за монетки площадки или рекламу.
var HINT_COST=3,hintBusy=false;
function giveHint(){
  var g=game(),known={};
  g.guesses.forEach(function(w){for(var i=0;i<LEN;i++)if(w[i]===g.answer[i])known[i]=1});
  (g.hints||[]).forEach(function(i){known[i]=1});
  var open=[];for(var i=0;i<LEN;i++)if(!known[i])open.push(i);
  if(!open.length){toast('Все буквы уже открыты');return false}
  var pos=open[Math.random()*open.length|0];
  g.hints=(g.hints||[]).concat([pos]);
  toast('Буква «'+g.answer[pos].toUpperCase()+'» стоит на '+(pos+1)+'-м месте',2200);
  renderBoard();save();return true;
}
document.getElementById('hintBtn').addEventListener('click',function(){
  var g=game();
  if(g.done||busy||hintBusy)return;
  // Сначала — загадка, потом одна буква бесплатно, дальше — за монетки или рекламу.
  if(!g.clue){g.clue=true;renderSeg();save();return}
  if(!g.hints||!g.hints.length){giveHint();return}
  if(!sdk){toast('Бесплатные подсказки закончились');return}
  if(g.hints.length===1&&!g.paidAsked){g.paidAsked=true;toast('Следующая буква — за '+HINT_COST+' монетки. Нажмите ещё раз',2400);return}
  hintBusy=true;
  var hosted=sdk.environment.host==='gamely';
  var p=hosted?sdk.coins.spend(HINT_COST,'Подсказка в «Слове дня»').then(function(r){if(r.ok)return true;if(r.reason==='cancelled')return false;return sdk.ads.rewarded().then(function(a){return a.rewarded})})
    :sdk.ads.rewarded().then(function(a){return a.rewarded});
  p.then(function(ok){if(ok)giveHint()},function(){}).then(function(){hintBusy=false});
});
document.getElementById('top').addEventListener('mousedown',function(e){e.preventDefault()});

// ---------- окна ----------
var X_SVG='<button id="x" aria-label="Закрыть"><svg viewBox="0 0 16 16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button>';
function openModal(html){
  card.innerHTML=X_SVG+html;modal.classList.add('show');
  document.getElementById('x').addEventListener('click',closeModal);
}
function closeModal(){modal.classList.remove('show');card.innerHTML=''}
modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
function exRow(word,marks){
  return '<div class="ex">'+word.split('').map(function(ch,i){return '<div class="t fill '+(marks[i]||'')+'"><div class="f">'+ch+'</div></div>'}).join('')+'</div>';
}
function showHelp(){
  openModal('<h2>Как играть</h2>'+
    '<p>Угадайте слово за шесть попыток. Это всегда существительное в именительном падеже, буква Ё пишется как Е. «Слово дня» — из пяти букв, в режиме «Ещё слово» можно выбрать 5, 6 или 7 букв.</p>'+
    '<p>Кнопка с лампочкой — подсказка. Первое нажатие показывает загадку о слове, второе открывает одну букву. Следующие буквы — за монетки.</p>'+
    '<p>После каждой попытки буквы подсвечиваются:</p>'+
    exRow('пирог',['c'])+'<p><b>П</b> есть в слове и стоит на своём месте.</p>'+
    exRow('песок',['','p'])+'<p><b>Е</b> есть в слове, но в другом месте.</p>'+
    exRow('ветка',['','','','a'])+'<p><b>К</b> в слове нет.</p>'+
    '<p>«Слово дня» одно на всех и меняется в полночь. В режиме «Ещё слово» можно играть сколько угодно.</p>'+
    '<div class="btns" style="margin-top:14px"><button class="bt" data-enter id="hOk">Играть</button></div>');
  document.getElementById('hOk').addEventListener('click',closeModal);
  if(!st.help){st.help=true;save()}
}
function shareText(){
  var g=game(),n=g.won?g.guesses.length:'X';
  var head=(st.mode==='daily'?'Слово дня '+fmtDate(g.date):'Слово дня, '+LEN+' букв')+' — '+n+'/6'+(g.clue||(g.hints&&g.hints.length)?' с подсказкой':'');
  var rows=g.guesses.map(function(w){return evaluate(w,g.answer).map(function(s){return s==='c'?'🟩':s==='p'?'🟨':'⬜'}).join('')});
  return head+'\n'+rows.join('\n')+'\n#GamelyСловоДня';
}
function showStats(end){
  var s=st.stats,g=game(),max=Math.max.apply(null,s.dist.concat([1]));
  var pct=s.played?Math.round(s.wins/s.played*100):0;
  var html='<h2>'+(end&&g.done?(g.won?WIN_MSG[g.guesses.length-1]:'Не получилось'):'Статистика')+'</h2>';
  if(end&&g.done)html+='<div class="word">Загаданное слово:<b>'+g.answer+'</b></div>';
  html+='<div class="nums"><div><b>'+s.played+'</b><small>Сыграно</small></div><div><b>'+pct+'</b><small>% побед</small></div><div><b>'+s.streak+'</b><small>Серия побед</small></div><div><b>'+s.maxStreak+'</b><small>Лучшая серия</small></div></div>';
  html+='<div class="dist"><h3>С какой попытки угадано</h3>';
  for(var i=0;i<6;i++){
    var hl=g.done&&g.won&&g.guesses.length===i+1;
    html+='<div class="dr"><span>'+(i+1)+'</span><div class="bar'+(hl?' hl':'')+'" style="width:'+Math.max(7,s.dist[i]/max*100)+'%;animation-delay:'+(i*60)+'ms">'+s.dist[i]+'</div></div>';
  }
  html+='</div>';
  if(st.mode==='daily'&&g.done)html+='<div class="next">Новое слово дня через <b id="nextT">'+untilMidnight()+'</b></div>';
  html+='<div class="btns">';
  if(g.done)html+='<button class="bt alt" id="shareBtn">Скопировать результат</button>';
  html+='<button class="bt" data-enter id="moreBtn">'+(g.done||st.mode==='daily'?'Ещё слово':'Продолжить')+'</button></div><div id="shareBox"></div>';
  openModal(html);
  var sb=document.getElementById('shareBtn');if(sb)sb.addEventListener('click',share);
  document.getElementById('moreBtn').addEventListener('click',function(){if(g.done||st.mode==='daily')nextWord();else closeModal()});
}
function share(){
  var text=shareText();
  var fallback=function(){
    var box=document.getElementById('shareBox');if(!box)return;
    box.innerHTML='<p id="shareP" style="margin:12px 0 0;font-size:14px"></p><textarea id="shareTxt" readonly></textarea>';
    var ta=document.getElementById('shareTxt');ta.value=text;ta.focus();ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.getElementById('shareP').textContent=ok?'Результат скопирован. Вот он, если понадобится ещё раз:':'Скопировать автоматически не вышло — выделите текст и скопируйте:';
    if(ok){toast('Результат скопирован');var b=document.getElementById('shareBtn');if(b)b.textContent='Скопировано!'}
    try{ta.scrollIntoView({block:'nearest'})}catch(e){}
  };
  try{
    var fp=document.featurePolicy||document.permissionsPolicy,allowed=!fp||!fp.allowsFeature||fp.allowsFeature('clipboard-write');
    if(allowed&&navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('Результат скопирован');var b=document.getElementById('shareBtn');if(b)b.textContent='Скопировано!'},fallback);
      return;
    }
  }catch(e){}
  fallback();
}
function confetti(){
  var cols=['#4fe58f','#ffd866','#5fd3ff','#ff7aa8','#ffffff'],W=window.innerWidth,H=window.innerHeight;
  for(var i=0;i<40;i++){
    var c=document.createElement('div');c.className='conf';
    c.style.left=(W/2)+'px';c.style.top=(H*.35)+'px';c.style.background=cols[i%cols.length];
    c.style.setProperty('--dx',(Math.random()-.5)*W*.9+'px');c.style.setProperty('--dy',(Math.random()*.7+.1)*H+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    c.style.animationDelay=(Math.random()*.15)+'s';
    document.body.appendChild(c);setTimeout(function(el){el.remove()}.bind(null,c),1700);
  }
}

document.addEventListener('touchmove',function(e){if(!e.target.closest('#card'))e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
window.addEventListener('resize',layout);

build();layout();
st.daily=newDaily();renderBoard();
function ready(s,hadSave){
  if(!hadSave&&!st.help)showHelp();
  if(s)s.game.ready();
}
if(window.Gamely){
  Gamely.init().then(function(s){
    s.on('pause',function(){paused=true});
    s.on('resume',function(){paused=false});
    return s.data.get().catch(function(){return null}).then(function(d){
      var had=applySave(d);
      sdk=s;
      renderBoard();
      if(touched)save();
      ready(s,had);
    });
  }).catch(function(){ready(null,false)});
}else ready(null,false);
try{window.focus()}catch(e){}
window.__game={get answer(){return game().answer},get mode(){return st.mode},get guesses(){return game().guesses.slice()},get stats(){return JSON.parse(JSON.stringify(st.stats))},get cur(){return cur},get flags(){return {busy:busy,paused:paused,adBusy:adBusy,modal:modal.classList.contains('show'),done:game().done}},allowed:function(w){return ALLOWED.has(w)}};
})();
</script>
