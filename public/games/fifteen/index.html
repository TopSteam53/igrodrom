<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Пятнашки</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#2370c4 0%,#103a7a 45%,#081a3d 100%);color:#eaf4ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:#fff;padding:0;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible{outline:3px solid #8fe6ff;outline-offset:2px}
#top{width:var(--s);height:var(--h);display:flex;align-items:center;gap:calc(var(--h)*.14);margin-bottom:var(--g)}
h1{margin:0 auto 0 0;font-size:calc(var(--h)*.52);font-weight:900;line-height:1;letter-spacing:-.02em;background:linear-gradient(135deg,#9ff3ff,#4dc3ff 45%,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.box{position:relative;background:linear-gradient(#173f7f,#10306a);border-radius:10px;padding:0 8px;height:100%;min-width:calc(var(--h)*1.45);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.06)}
.box small{font-size:max(9px,calc(var(--h)*.19));color:#9fc3f0;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.box b{font-size:calc(var(--h)*.36);line-height:1.1;font-variant-numeric:tabular-nums}
.box.tick b{animation:tick .2s}
@keyframes tick{50%{transform:scale(1.18);color:#ffe27a}}
.sq{height:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#43d9ff,#2a6bff);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sq svg{width:50%;height:50%}
.sq:active{transform:translateY(2px)}
#bwrap{position:relative;width:var(--s);height:var(--s)}
#board{position:absolute;inset:0;background:linear-gradient(150deg,#0e2a5e,#0a1f47);border-radius:calc(var(--s)*.04);box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 0 0 2px #1d4590,inset 0 2px 0 rgba(255,255,255,.08)}
.slot,.tile{position:absolute;left:0;top:0;width:var(--t);height:var(--t)}
.slot{border-radius:calc(var(--t)*.16);background:#0b2252;box-shadow:inset 0 3px 6px rgba(0,0,0,.45)}
.tile{transition:transform .11s ease-out;will-change:transform;cursor:pointer}
.tile .in{width:100%;height:100%;border-radius:calc(var(--t)*.16);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--t)*.44);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 calc(var(--t)*-.07) 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.45),0 4px 10px rgba(0,0,0,.3);position:relative;overflow:hidden}
.tile .in::before{content:'';position:absolute;left:8%;right:8%;top:6%;height:34%;border-radius:calc(var(--t)*.12);background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0))}
.tile.dark .in{color:#4a3300;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.tile .in::after{content:'';position:absolute;right:9%;bottom:12%;width:calc(var(--t)*.09);height:calc(var(--t)*.09);border-radius:50%;background:#fff;opacity:0;transform:scale(0);transition:opacity .2s,transform .2s}
.tile.ok .in::after{opacity:.85;transform:scale(1)}
.tile:active .in{filter:brightness(1.08)}
.tile.bump .in{animation:bump .22s}
@keyframes bump{30%{transform:translateX(var(--bx,0)) translateY(var(--by,0))}}
.tile.wave .in{animation:wave .7s ease-out backwards}
@keyframes wave{35%{transform:scale(1.12);filter:brightness(1.35)}}
.n5 .tile .in{font-size:calc(var(--t)*.42)}
.n3 .tile .in{font-size:calc(var(--t)*.46)}
#bot{width:var(--s);height:var(--b);margin-top:var(--g);display:flex;align-items:center;gap:calc(var(--b)*.25)}
#seg{height:100%;display:flex;background:#0b2252;border-radius:12px;padding:4px;gap:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
#seg button{height:100%;padding:0 calc(var(--b)*.32);border-radius:9px;font-weight:800;font-size:max(12px,calc(var(--b)*.36));color:#9fc3f0;background:transparent;transition:background .15s,color .15s}
#seg button.on{background:linear-gradient(135deg,#43d9ff,#2a6bff);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
#bestBox{margin-left:auto;text-align:right;display:flex;flex-direction:column;justify-content:center;line-height:1.2;min-width:0}
#bestBox small{font-size:max(10px,calc(var(--b)*.28));color:#9fc3f0;font-weight:700}
#bestBox b{font-size:max(12px,calc(var(--b)*.36));white-space:nowrap;font-variant-numeric:tabular-nums}
#ov{position:absolute;inset:0;border-radius:calc(var(--s)*.04);background:rgba(6,18,44,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*.035);z-index:50;text-align:center;animation:fade .3s;overflow:hidden;padding:calc(var(--s)*.05)}
#ov.show{display:flex}
@keyframes fade{from{opacity:0}}
.ovT{position:relative;font-size:calc(var(--s)*.1);font-weight:900;line-height:1;background:linear-gradient(135deg,#9ff3ff,#4dc3ff 45%,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.ovS{position:relative;font-size:max(13px,calc(var(--s)*.045));color:#c4dcff;max-width:90%}
.stats{position:relative;display:flex;gap:calc(var(--s)*.025)}
.stat{background:rgba(255,255,255,.08);border-radius:12px;padding:calc(var(--s)*.02) calc(var(--s)*.04);display:flex;flex-direction:column;gap:2px;min-width:calc(var(--s)*.24)}
.stat small{font-size:max(10px,calc(var(--s)*.032));color:#9fc3f0}
.stat b{font-size:calc(var(--s)*.065);font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:max(10px,calc(var(--s)*.03));font-weight:800;color:#3b2a00;background:#ffd23f;border-radius:999px;padding:.1em .5em;margin-top:3px;animation:pop .45s ease-out .35s backwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}}
.btns{position:relative;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:calc(var(--s)*.025) calc(var(--s)*.06);border-radius:999px;font-size:max(13px,calc(var(--s)*.048));font-weight:800;background:linear-gradient(135deg,#43d9ff,#2a6bff);box-shadow:0 4px 0 #173f9e}
.btn.alt{background:#1f4a8f;box-shadow:0 4px 0 #0f2a5a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #173f9e}
.conf-p{position:absolute;top:-6%;width:calc(var(--s)*.018);height:calc(var(--s)*.03);border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(var(--s)*1.15)) rotate(720deg)}}
#hint{margin-top:4px;font-size:12px;color:#7fa3d6;height:16px;white-space:nowrap}
</style>
</head>
<body>
<div id="top">
  <h1>Пятнашки</h1>
  <div class="box" id="movesBox"><small>Ходы</small><b id="moves">0</b></div>
  <div class="box"><small>Время</small><b id="time">0:00</b></div>
  <button id="newBtn" class="sq" title="Перемешать" aria-label="Перемешать"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
</div>
<div id="bwrap">
  <div id="board"></div>
  <div id="ov"></div>
</div>
<div id="bot">
  <div id="seg"><button data-n="3">3×3</button><button data-n="4">4×4</button><button data-n="5">5×5</button></div>
  <div id="bestBox"><small id="bestLbl">Рекорд 4×4</small><b id="bestTxt">—</b></div>
</div>
<div id="hint">Нажмите на плитку рядом с пустой клеткой, свайп или стрелки</div>
<script src="../../sdk/v1.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var root=document.documentElement,board=$('board'),ov=$('ov');
var PAL=[['#ff7a85','#e8404f','#a8202e'],['#ffb85c','#ff8a1f','#b85500'],['#ffe36b','#ffc21a','#b78300'],['#62e6a8','#1fbf75','#0b7d4b'],['#6fd0ff','#2a8cff','#1355b5']];
var n=4,cells=[],tiles=[],moves=0,elapsed=0,started=false,done=false;
var best={3:null,4:null,5:null},wins={3:0,4:0,5:0};
var paused=false,hidden=document.hidden,ovOpen=false,touched=false,tsz=60,gp=8,pd=12,size=300;

function fmt(t){t=Math.floor(t);var mm=t/60|0,ss=t%60;return mm+':'+(ss<10?'0':'')+ss}
function plural(x,a,b,c){var m10=x%10,m100=x%100;return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<12||m100>14)?b:c}
function movesTxt(x){return x+' '+plural(x,'ход','хода','ходов')}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}

// Решаемость: считаем инверсии; на поле чётной ширины учитываем ещё и ряд пустой клетки (снизу).
function solvable(a,w){
  var inv=0,b=a.indexOf(0);
  for(var i=0;i<a.length;i++)if(a[i])for(var j=i+1;j<a.length;j++)if(a[j]&&a[i]>a[j])inv++;
  if(w%2)return inv%2===0;
  return (inv+(w-(b/w|0)))%2===1;
}
function distance(a,w){var d=0;for(var i=0;i<a.length;i++)if(a[i]){var t=a[i]-1;d+=Math.abs((t/w|0)-(i/w|0))+Math.abs(t%w-i%w)}return d}
function solved(a){for(var i=0;i<a.length-1;i++)if(a[i]!==i+1)return false;return true}
function shuffled(w){
  var N=w*w,a;
  do{
    a=[];for(var i=0;i<N;i++)a.push(i);shuffleArr(a);
    if(!solvable(a,w)){var x=-1,y=-1;for(i=0;i<N;i++)if(a[i]){if(x<0)x=i;else{y=i;break}}var t=a[x];a[x]=a[y];a[y]=t}
  }while(solved(a)||distance(a,w)<N);
  return a;
}

function build(){
  board.innerHTML='';tiles=[];
  board.className='n'+n;
  for(var i=0;i<n*n;i++){var s=document.createElement('div');s.className='slot';s.dataset.i=i;board.appendChild(s)}
  for(var v=1;v<n*n;v++){
    var el=document.createElement('div');el.className='tile';el.dataset.v=v;
    var inn=document.createElement('div');inn.className='in';inn.textContent=v;el.appendChild(inn);
    var p=PAL[Math.min(PAL.length-1,Math.round(((v-1)/n|0)*(PAL.length-1)/(n-1)))];
    el.style.setProperty('--c1',p[0]);el.style.setProperty('--c2',p[1]);
    if(p===PAL[2])el.classList.add('dark');
    board.appendChild(el);tiles[v]=el;
  }
  measure();place(true);
}
function xy(i){return [pd+(i%n)*(tsz+gp),pd+(i/n|0)*(tsz+gp)]}
function place(instant){
  board.querySelectorAll('.slot').forEach(function(s){var p=xy(+s.dataset.i);s.style.transform='translate('+p[0]+'px,'+p[1]+'px)'});
  for(var i=0;i<cells.length;i++){
    var v=cells[i];if(!v)continue;var el=tiles[v],p=xy(i);
    if(instant)el.style.transition='none';
    el.style.transform='translate('+p[0]+'px,'+p[1]+'px)';
    el.classList.toggle('ok',v===i+1);
    if(instant){void el.offsetWidth;el.style.transition=''}
  }
}
function measure(){
  pd=Math.round(size*.03);gp=Math.round(size*(n===5?.018:.025));
  tsz=(size-pd*2-gp*(n-1))/n;
  root.style.setProperty('--t',tsz+'px');
}
function newGame(w){
  n=w;cells=shuffled(n);moves=0;elapsed=0;started=false;done=false;
  hideOv();build();updHud();
}
function updHud(){
  $('moves').textContent=moves;$('time').textContent=fmt(elapsed);
  [].forEach.call(document.querySelectorAll('#seg button'),function(b){b.classList.toggle('on',+b.dataset.n===n)});
  $('bestLbl').textContent='Рекорд '+n+'×'+n;
  var b=best[n];$('bestTxt').textContent=b?movesTxt(b.m)+', '+fmt(b.t):'пока нет';
}

// Нажали на плитку в одном ряду или столбце с пустой клеткой — сдвигаем к ней все плитки между ними.
function moveFrom(i){
  if(done||ovOpen||i<0||i>=n*n)return false;
  var g=cells.indexOf(0);if(i===g)return false;
  var gr=g/n|0,gc=g%n,r=i/n|0,c=i%n,step;
  if(r===gr)step=c>gc?1:-1;else if(c===gc)step=c===gc&&r>gr?n:-n;else{bump(i);return false}
  var cnt=0;
  while(g!==i){var nx=g+step;cells[g]=cells[nx];cells[nx]=0;g=nx;cnt++}
  moves+=cnt;touched=true;
  if(!started){started=true;if(sdk)sdk.game.start()}
  place(false);updHud();
  var mb=$('movesBox');mb.classList.remove('tick');void mb.offsetWidth;mb.classList.add('tick');
  if(solved(cells))win();else save();
  return true;
}
function bump(i){
  var v=cells[i];if(!v)return;var el=tiles[v],g=cells.indexOf(0);
  var dx=Math.sign((g%n)-(i%n)),dy=Math.sign((g/n|0)-(i/n|0));
  el.style.setProperty('--bx',(dx*tsz*.06)+'px');el.style.setProperty('--by',(dy*tsz*.06)+'px');
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
}
// dir — куда едет плитка: 0 вверх, 1 вправо, 2 вниз, 3 влево.
function slide(dir){
  if(done||ovOpen)return;
  var g=cells.indexOf(0),gr=g/n|0,gc=g%n,src=-1;
  if(dir===0&&gr<n-1)src=g+n;
  if(dir===2&&gr>0)src=g-n;
  if(dir===3&&gc<n-1)src=g+1;
  if(dir===1&&gc>0)src=g-1;
  if(src>=0)moveFrom(src);
}
function win(){
  done=true;
  var t=Math.floor(elapsed),b=best[n],recM=!b||moves<b.m,recT=!b||t<b.t;
  best[n]={m:b?Math.min(b.m,moves):moves,t:b?Math.min(b.t,t):t};wins[n]++;
  save();updHud();
  if(sdk)sdk.game.stop();
  for(var i=0;i<cells.length;i++){var v=cells[i];if(v){var el=tiles[v];el.style.animationDelay='';el.firstChild.style.animationDelay=((i/n|0)+(i%n))*55+'ms';el.classList.add('wave')}}
  setTimeout(function(){
    showOv('<div class="ovT">Собрано!</div><div class="ovS">Поле '+n+'×'+n+'</div>'+
      '<div class="stats"><div class="stat"><small>Ходы</small><b>'+moves+'</b>'+(recM?'<i>Рекорд!</i>':'')+'</div><div class="stat"><small>Время</small><b>'+fmt(t)+'</b>'+(recT?'<i>Рекорд!</i>':'')+'</div></div>'+
      '<div class="btns"><button class="btn" data-a="again">Ещё раз</button></div>');
    confetti();
    var a=ov.querySelector('[data-a="again"]');if(a)a.focus();
  },900);
}
function confetti(){
  var cols=['#ffd23f','#43d9ff','#ff7a85','#62e6a8','#ffb85c','#fff'];
  for(var k=0;k<40;k++){var p=document.createElement('i');p.className='conf-p';p.style.left=(Math.random()*100)+'%';p.style.background=cols[k%cols.length];p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=(Math.random()*.8)+'s';ov.insertBefore(p,ov.firstChild)}
}
function showOv(h){ov.innerHTML=h;ov.classList.add('show');ovOpen=true}
function hideOv(){ov.classList.remove('show');ov.innerHTML='';ovOpen=false}
function askNew(w){
  if(done||!started||moves===0){startNew(w);return}
  showOv('<div class="ovT">Начать заново?</div><div class="ovS">Новая партия '+w+'×'+w+'. Текущая будет потеряна.</div>'+
    '<div class="btns"><button class="btn alt" data-a="cancel">Отмена</button><button class="btn" data-a="new" data-n="'+w+'">Перемешать</button></div>');
  var b=ov.querySelector('[data-a="new"]');if(b)b.focus();
}
// После собранной головоломки, перед следующей, — естественная пауза для полноэкранной рекламы.
var starting=false;
function startNew(w){
  if(starting)return;
  var ad=done&&sdk?sdk.ads.fullscreen().catch(function(){return{shown:false}}):Promise.resolve();
  starting=true;touched=true;
  ad.then(function(){starting=false;newGame(w);save()});
}
ov.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='again')startNew(n);
  else if(b.dataset.a==='cancel')hideOv();
  else if(b.dataset.a==='new')startNew(+b.dataset.n);
});
$('newBtn').addEventListener('click',function(e){askNew(n);e.currentTarget.blur()});
$('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;b.blur();var w=+b.dataset.n;if(w===n&&!done)return;askNew(w)});

// ---------- сохранение через Игродром SDK ----------
// sdk присваиваем только после чтения сохранения, иначе ранний ход затрёт старую партию.
var sdk=null,savedAt=0;
function save(){
  if(!sdk)return;
  savedAt=elapsed;
  var game=done?null:{n:n,cells:cells.slice(),moves:moves,t:Math.floor(elapsed),started:started};
  sdk.data.set({v:1,size:n,best:best,wins:wins,game:game}).catch(function(){});
}
function nat(x){return typeof x==='number'&&isFinite(x)&&x>=0?Math.floor(x):null}
function validGame(g){
  if(!g||typeof g!=='object'||[3,4,5].indexOf(g.n)<0||!Array.isArray(g.cells)||g.cells.length!==g.n*g.n)return false;
  var seen={};
  for(var i=0;i<g.cells.length;i++){var v=g.cells[i];if(typeof v!=='number'||v!==(v|0)||v<0||v>=g.cells.length||seen[v])return false;seen[v]=1}
  if(!solvable(g.cells,g.n)||solved(g.cells))return false;
  return nat(g.moves)!==null&&nat(g.t)!==null;
}
function applySave(d){
  if(!d||typeof d!=='object'||d.v!==1)return;
  [3,4,5].forEach(function(k){
    var b=d.best&&d.best[k];
    if(b&&nat(b.m)!==null&&nat(b.t)!==null&&b.m>0){var c=best[k];best[k]={m:c?Math.min(c.m,nat(b.m)):nat(b.m),t:c?Math.min(c.t,nat(b.t)):nat(b.t)}}
    if(d.wins&&nat(d.wins[k])!==null)wins[k]=Math.max(wins[k],nat(d.wins[k]));
  });
  if(!touched){
    if(validGame(d.game)){
      var g=d.game;n=g.n;cells=g.cells.slice();moves=nat(g.moves);elapsed=nat(g.t);started=g.started===true||moves>0;done=false;
      hideOv();build();
    }else if([3,4,5].indexOf(d.size)>=0&&d.size!==n){newGame(d.size)}
  }
  updHud();
}

// ---------- таймер и пауза ----------
var lastTick=performance.now();
function running(){return started&&!done&&!paused&&!hidden&&!ovOpen}
setInterval(function(){
  var now=performance.now(),run=running();
  if(run)elapsed+=Math.min(1,(now-lastTick)/1000);
  lastTick=now;$('time').textContent=fmt(elapsed);
  if(run&&elapsed-savedAt>=10)save();
},250);
document.addEventListener('visibilitychange',function(){hidden=document.hidden;if(hidden)save()});

// ---------- управление ----------
var KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
window.addEventListener('keydown',function(e){
  if(ovOpen){
    if(e.key==='Escape'&&!done){e.preventDefault();hideOv()}
    else if(e.code&&e.code.indexOf('Arrow')===0){var bs=[].slice.call(ov.querySelectorAll('button'));if(bs.length){e.preventDefault();var ix=bs.indexOf(document.activeElement);bs[(ix+1)%bs.length].focus()}}
    return;
  }
  var d=KEYS[e.code];if(d===undefined)d=KEYS[e.key];
  if(d!==undefined){e.preventDefault();slide(d);return}
  if(e.code==='KeyR'||e.code==='KeyN'){askNew(n);return}
  if(e.code==='Digit3'||e.code==='Digit4'||e.code==='Digit5'){var w=+e.code.slice(5);if(w!==n||done)askNew(w)}
});
var sx=null,sy=0,pid=null,downTile=-1;
document.addEventListener('pointerdown',function(e){
  if(e.target.closest('button')||ovOpen)return;
  sx=e.clientX;sy=e.clientY;pid=e.pointerId;
  var t=e.target.closest('.tile');downTile=t?cells.indexOf(+t.dataset.v):-1;
});
document.addEventListener('pointerup',function(e){
  if(sx===null||e.pointerId!==pid)return;
  var dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);sx=null;
  if(Math.max(ax,ay)<Math.max(14,tsz*.22)){if(downTile>=0)moveFrom(downTile);return}
  slide(ax>ay?(dx>0?1:3):(dy>0?2:0));
});
document.addEventListener('pointercancel',function(){sx=null});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

// ---------- размеры ----------
function layout(){
  var W=window.innerWidth,H=window.innerHeight;
  var h=Math.round(Math.max(38,Math.min(58,H*.075))),b=Math.round(Math.max(34,Math.min(48,H*.065))),g=Math.round(Math.max(6,Math.min(12,H*.015)));
  var showHint=H>=520;$('hint').style.display=showHint?'':'none';
  var s=Math.floor(Math.min(W-16,H-h-b-2*g-16-(showHint?20:0),680));
  size=Math.max(200,s);
  root.style.setProperty('--s',size+'px');root.style.setProperty('--h',h+'px');root.style.setProperty('--b',b+'px');root.style.setProperty('--g',g+'px');
  measure();place(true);
}
window.addEventListener('resize',layout);
newGame(4);layout();
if(window.Igrodrom)Igrodrom.init().then(function(s){
  s.on('pause',function(){paused=true});
  s.on('resume',function(){paused=false;lastTick=performance.now()});
  return s.data.get().catch(function(){return null}).then(function(d){
    sdk=s;applySave(d);
    if(touched)save(); // игрок успел походить до загрузки сохранения — сохраняем его партию
    s.game.ready();
  });
}).catch(function(){});
try{window.focus()}catch(e){}
window.__game={get cells(){return cells.slice()},get n(){return n},get moves(){return moves},get done(){return done},get time(){return elapsed},get best(){return JSON.parse(JSON.stringify(best))},moveFrom:moveFrom,slide:slide,solvable:solvable};
})();
