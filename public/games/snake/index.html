<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Змейка</title>
<style>
*{box-sizing:border-box}
.hidden{display:none!important}
html,body{margin:0;height:100%;background:#0f1226;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
#hud{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;min-height:36px}
#hud .pill{background:#1d2250;border-radius:999px;padding:6px 12px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
#hud .bonus{background:#3b2f8f}
canvas{display:block;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:#1d2250;color:#fff;font-size:18px;cursor:pointer}
#pad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{border:0;border-radius:14px;background:#1d2250;color:#cfd5ff;font-size:24px}
#pad button:active{background:#3b2f8f}
@media (pointer:coarse){#pad{display:grid}}
.scr{position:fixed;inset:0;background:rgba(10,12,30,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.scr.hidden{display:none}
.card{background:#171b40;border-radius:22px;padding:22px;width:min(440px,100%);max-height:94vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-size:40px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:26px;margin:0 0 8px}
.sub{color:#a3abe0;margin:0 0 16px;font-size:15px}
.btn{display:block;width:100%;margin:8px 0;padding:14px;border:0;border-radius:14px;font:700 17px system-ui,sans-serif;cursor:pointer;color:#0f1226;background:#4ade80;box-shadow:0 4px 0 #15803d}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #15803d}
.btn.alt{background:#2a3070;color:#fff;box-shadow:0 4px 0 #11143a}
.btn.gold{background:#FFC531;box-shadow:0 4px 0 #b8860b}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row .btn{flex:1}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.lv{aspect-ratio:1;border:0;border-radius:14px;background:#2a3070;color:#fff;font:800 20px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv small{font-size:11px;letter-spacing:1px;color:#FFC531}
.lv.locked{background:#14173a;color:#4b5287;cursor:default}
.lv.next{outline:3px solid #4ade80}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.skin{border:2px solid transparent;border-radius:14px;background:#2a3070;color:#fff;padding:10px 4px;cursor:pointer;font:600 13px system-ui}
.skin.on{border-color:#4ade80}
.skin canvas{border-radius:8px;box-shadow:none;margin:0 auto 6px}
.stars{font-size:38px;letter-spacing:6px;margin:6px 0}
.stars .off{opacity:.2}
.big{font-size:44px;font-weight:800;margin:4px 0}
.note{color:#a3abe0;font-size:13px;margin:8px 0 0}
.lb{list-style:none;padding:0;margin:10px 0;text-align:left;font-size:14px}
.lb li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:5px 8px;border-radius:8px}
.lb li.me{background:#2a3070;font-weight:700}
.apples{color:#ff8a9a;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="pill" id="hScore">0</span>
    <span class="pill" id="hGoal"></span>
    <span class="pill bonus hidden" id="hBonus"></span>
    <button class="ib" id="pauseBtn" aria-label="Пауза">⏸</button>
  </div>
  <canvas id="c"></canvas>
  <div id="pad" aria-hidden="true">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
</div>

<div class="scr" id="menu"><div class="card">
  <h1>🐍 Змейка</h1>
  <p class="sub">Рекорд: <b id="mBest">0</b> · <span class="apples">🍎 <span id="mApples">0</span></span></p>
  <button class="btn" id="toLevels">Уровни</button>
  <button class="btn gold" id="toEndless">Бесконечный режим</button>
  <div class="row"><button class="btn alt" id="toSkins">Скины</button><button class="btn alt" id="muteBtn">🔊 Звук</button></div>
  <p class="note" id="ctrlNote"></p>
</div></div>

<div class="scr hidden" id="levels"><div class="card">
  <h2>Уровни</h2>
  <p class="sub">Съешьте нужное число яблок. Золотые яблоки — звёзды.</p>
  <div class="levels" id="lvGrid"></div>
  <button class="btn alt" data-back>Назад</button>
</div></div>

<div class="scr hidden" id="skins"><div class="card">
  <h2>Скины</h2>
  <p class="sub">Яблоки копятся в каждой игре: <span class="apples">🍎 <span id="sApples">0</span></span></p>
  <div class="skins" id="skinGrid"></div>
  <button class="btn alt" data-back>Назад</button>
</div></div>

<div class="scr hidden" id="pause"><div class="card">
  <h2>Пауза</h2>
  <button class="btn" id="resumeBtn">Продолжить</button>
  <button class="btn alt" id="quitBtn">В меню</button>
</div></div>

<div class="scr hidden" id="over"><div class="card">
  <h2 id="oTitle">Конец игры</h2>
  <div class="stars hidden" id="oStars"></div>
  <div class="big" id="oScore">0</div>
  <p class="sub" id="oSub"></p>
  <div id="oRevive">
    <button class="btn gold hidden" id="coinRevive">Продолжить за 🪙 10</button>
    <button class="btn alt hidden" id="adRevive">Продолжить за рекламу</button>
  </div>
  <button class="btn" id="oNext">Следующий уровень</button>
  <button class="btn" id="oAgain">Ещё раз</button>
  <button class="btn alt" id="oMenu">В меню</button>
  <div id="board"></div>
</div></div>

<script src="../../sdk/v1.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const N = 20;                       // поле N×N
const LEVELS = 24;
const REVIVE_COST = 10;
const SKINS = [
  { id: 'classic', name: 'Классика', price: 0, body: ['#4ade80', '#22c55e'], head: '#a7f3d0' },
  { id: 'ocean', name: 'Океан', price: 40, body: ['#38bdf8', '#2563eb'], head: '#bae6fd' },
  { id: 'fire', name: 'Огонь', price: 80, body: ['#fb923c', '#dc2626'], head: '#fde68a' },
  { id: 'candy', name: 'Конфета', price: 120, body: ['#f9a8d4', '#ffffff'], head: '#fbcfe8', stripes: true },
  { id: 'night', name: 'Ночь', price: 180, body: ['#a78bfa', '#4c1d95'], head: '#ddd6fe' },
  { id: 'rainbow', name: 'Радуга', price: 260, body: null, head: '#ffffff', rainbow: true },
  { id: 'gold', name: 'Золото', price: 400, body: ['#FFC531', '#b8860b'], head: '#fff7d6' },
  { id: 'ghost', name: 'Призрак', price: 300, body: ['#e2e8f0', '#94a3b8'], head: '#ffffff', alpha: 0.75 },
  { id: 'zebra', name: 'Зебра', price: 150, body: ['#f8fafc', '#111827'], head: '#f8fafc', stripes: true },
];
const BONUS = {
  slow: { icon: '🐢', color: '#38bdf8', text: 'Замедление', time: 6 },
  ghost: { icon: '👻', color: '#c4b5fd', text: 'Сквозь себя', time: 6 },
  cut: { icon: '✂️', color: '#f472b6', text: 'Хвост короче', time: 0 },
  star: { icon: '⭐', color: '#FFC531', text: '+5 очков', time: 0 },
};

// ---------- сохранение ----------
let save = { v: 2, best: 0, open: 1, stars: [], apples: 0, skins: ['classic'], skin: 'classic', mute: false };
let sdk = null;
function applySave(d) {
  if (!d || typeof d !== 'object') return;
  if (typeof d.best === 'number' && isFinite(d.best)) save.best = Math.max(save.best, Math.floor(d.best));
  if (d.v === 2) {
    if (Number.isInteger(d.open)) save.open = Math.min(LEVELS, Math.max(1, d.open));
    if (Array.isArray(d.stars)) save.stars = d.stars.slice(0, LEVELS).map((s) => Math.min(3, Math.max(0, s | 0)));
    if (Number.isInteger(d.apples)) save.apples = Math.max(0, d.apples);
    if (Array.isArray(d.skins)) save.skins = ['classic', ...d.skins.filter((s) => SKINS.some((k) => k.id === s && s !== 'classic'))];
    if (SKINS.some((k) => k.id === d.skin) && save.skins.includes(d.skin)) save.skin = d.skin;
    save.mute = !!d.mute;
  }
}
function persist() { if (sdk) sdk.data.set(save).catch(() => {}); }

// ---------- звук ----------
let ac = null;
function audio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d = 0.08, type = 'square', vol = 0.06, slide = 0) {
  if (save.mute || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  eat: () => tone(520 + Math.random() * 80, 0.07, 'square', 0.05, 1.5),
  gold: () => { tone(660, 0.08, 'triangle', 0.08); setTimeout(() => tone(990, 0.12, 'triangle', 0.08), 70); },
  bonus: () => tone(300, 0.25, 'sine', 0.08, 3),
  die: () => tone(220, 0.45, 'sawtooth', 0.07, 0.3),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.08), i * 110)),
};

// ---------- уровни ----------
// Детерминированный генератор: у каждого уровня всегда один и тот же лабиринт.
function rng(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function levelWalls(n) {
  const w = new Set();
  const add = (x, y) => { if (x >= 0 && y >= 0 && x < N && y < N) w.add(y * N + x); };
  const hline = (y, x0, x1) => { for (let x = x0; x <= x1; x++) add(x, y); };
  const vline = (x, y0, y1) => { for (let y = y0; y <= y1; y++) add(x, y); };
  const k = (n - 1) % 8, tier = Math.floor((n - 1) / 8);
  if (k === 1) { hline(6, 4, 15); hline(13, 4, 15); }
  if (k === 2) { vline(6, 4, 15); vline(13, 4, 15); }
  if (k === 3) { hline(9, 3, 7); hline(9, 12, 16); vline(9, 3, 7); vline(9, 12, 16); }
  if (k === 4) { for (const [x, y] of [[4, 4], [15, 4], [4, 15], [15, 15]]) { hline(y, x - 1, x + 1); vline(x, y - 1, y + 1); } }
  if (k === 5) { hline(4, 2, 12); hline(9, 7, 17); hline(14, 2, 12); }
  if (k === 6) { vline(5, 2, 10); vline(10, 9, 17); vline(15, 2, 10); }
  if (k === 7) { hline(5, 5, 14); hline(14, 5, 14); vline(5, 5, 8); vline(14, 11, 14); }
  if (k === 0 && n > 1) { const r = rng(n); for (let i = 0; i < 10 + tier * 4; i++) { const x = 2 + Math.floor(r() * 16), y = 2 + Math.floor(r() * 16); add(x, y); add(x + 1, y); } }
  // Начиная со второго круга — дополнительные столбики.
  if (tier >= 1 && k !== 0) { const r = rng(n * 7); for (let i = 0; i < tier * 4; i++) add(2 + Math.floor(r() * 16), 2 + Math.floor(r() * 16)); }
  // Старт змейки всегда свободен.
  for (let x = 3; x <= 9; x++) w.delete(10 * N + x);
  return w;
}
const levelGoal = (n) => 8 + Math.floor(n * 1.2);
const levelSpeed = (n) => Math.max(70, 150 - n * 3);

// ---------- состояние ----------
let mode = 'menu';        // menu | play | pause | over
let kind = 'endless';     // endless | level
let level = 1;
let snake, prev, dir, queue, walls, food, gold, bonus, effects, score, eaten, goldGot, goldPlan, interval, acc, revived, runs = 0, particles = [];
let lastT = 0;

function free() {
  const busy = new Set(snake.map((p) => p.y * N + p.x));
  for (const w of walls) busy.add(w);
  if (food) busy.add(food.y * N + food.x);
  if (gold) busy.add(gold.y * N + gold.x);
  if (bonus) busy.add(bonus.y * N + bonus.x);
  const cells = [];
  for (let i = 0; i < N * N; i++) if (!busy.has(i)) cells.push(i);
  const i = cells[Math.floor(Math.random() * cells.length)];
  return { x: i % N, y: Math.floor(i / N) };
}

function start(k, n = 1) {
  audio();
  kind = k; level = n;
  walls = k === 'level' ? levelWalls(n) : new Set();
  snake = [{ x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
  prev = snake.map((p) => ({ ...p }));
  dir = { x: 1, y: 0 }; queue = [];
  food = null; gold = null; bonus = null; effects = {};
  score = 0; eaten = 0; goldGot = 0; revived = false; particles = [];
  // На уровне два золотых яблока появляются после 3-го и 7-го обычного (или раньше на коротких уровнях).
  const goal = levelGoal(n);
  goldPlan = k === 'level' ? [Math.max(2, Math.floor(goal * 0.3)), Math.max(4, Math.floor(goal * 0.7))] : [];
  interval = k === 'level' ? levelSpeed(n) : 130;
  food = free();
  acc = 0; runs++;
  show(null); mode = 'play'; hud();
  sdk?.game.start();
}

function hud() {
  $('hScore').textContent = kind === 'level' ? `Уровень ${level}` : `Очки: ${score}`;
  $('hGoal').textContent = kind === 'level' ? `🍎 ${eaten} / ${levelGoal(level)} · ⭐ ${goldGot}` : `Рекорд: ${save.best}`;
  const active = Object.entries(effects).filter(([, t]) => t > 0);
  $('hBonus').classList.toggle('hidden', !active.length);
  $('hBonus').textContent = active.map(([k, t]) => `${BONUS[k].icon} ${Math.ceil(t)}`).join(' ');
}

function turn(x, y) {
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((x === -last.x && y === -last.y) || (x === last.x && y === last.y)) return;
  if (queue.length < 3) queue.push({ x, y });
}

function step() {
  if (queue.length) dir = queue.shift();
  prev = snake.map((p) => ({ ...p }));
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || walls.has(h.y * N + h.x);
  const hitSelf = snake.slice(0, -1).some((p) => p.x === h.x && p.y === h.y);
  if (hitWall || (hitSelf && !(effects.ghost > 0))) return die();
  // prev — где каждый сегмент был до шага: i-й сегмент приезжает из старой i-й клетки.
  snake.unshift(h);
  let grow = false;
  if (h.x === food.x && h.y === food.y) {
    grow = true; eaten++; score += 1; save.apples++; sfx.eat(); burst(h, '#ff5d73');
    food = free();
    if (goldPlan.includes(eaten)) gold = { ...free(), ttl: 7 };
    else if (kind === 'endless' && Math.random() < 0.12) gold = { ...free(), ttl: 6 };
    if (!bonus && (kind === 'endless' || level >= 4) && Math.random() < 0.18) {
      const types = Object.keys(BONUS).filter((t) => t !== 'star' || kind === 'endless');
      bonus = { ...free(), type: types[Math.floor(Math.random() * types.length)], ttl: 7 };
    }
    if (kind === 'endless' && eaten % 5 === 0) interval = Math.max(65, interval - 5);
  }
  if (gold && h.x === gold.x && h.y === gold.y) {
    grow = true; goldGot++; score += 3; save.apples += 3; sfx.gold(); burst(h, '#FFC531', 22); gold = null;
  }
  if (bonus && h.x === bonus.x && h.y === bonus.y) {
    sfx.bonus(); burst(h, BONUS[bonus.type].color, 18);
    if (bonus.type === 'cut') { for (let i = 0; i < 3 && snake.length > 3; i++) snake.pop(); }
    else if (bonus.type === 'star') score += 5;
    else effects[bonus.type] = BONUS[bonus.type].time;
    bonus = null;
  }
  if (!grow) snake.pop();
  if (kind === 'endless' && score > save.best) save.best = score;
  if (kind === 'level' && eaten >= levelGoal(level)) return win();
  hud();
}

function burst(p, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    particles.push({ x: p.x + 0.5, y: p.y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
  }
}

function die() {
  sfx.die(); mode = 'over'; sdk?.game.stop();
  if (navigator.vibrate) navigator.vibrate(120);
  burst(snake[0], '#ffffff', 26);
  persist();
  const hosted = sdk && sdk.environment.host === 'gamely';
  $('oTitle').textContent = kind === 'level' ? `Уровень ${level} не пройден` : score >= save.best && score > 0 ? 'Новый рекорд!' : 'Конец игры';
  $('oStars').classList.add('hidden');
  $('oScore').textContent = kind === 'level' ? `${eaten} / ${levelGoal(level)}` : score;
  $('oSub').textContent = kind === 'level' ? (eaten >= levelGoal(level) * 0.6 ? 'Почти! Осталось совсем немного.' : 'Попробуйте ещё раз — уровень запоминает звёзды.') : `Рекорд: ${save.best} · 🍎 ${save.apples}`;
  $('coinRevive').classList.toggle('hidden', revived || !hosted);
  $('adRevive').classList.toggle('hidden', revived || !sdk);
  $('oNext').classList.add('hidden');
  setTimeout(() => show('over'), 450);
  renderBoard(null);
  if (kind === 'endless' && sdk && score > 0) {
    sdk.leaderboard.setScore(save.best).catch(() => {}).then(() => sdk.leaderboard.getEntries({ top: 5, around: 1 })).then(renderBoard, () => {});
  }
}

function win() {
  sfx.win(); mode = 'over'; sdk?.game.stop();
  const stars = 1 + goldGot;
  save.stars[level - 1] = Math.max(save.stars[level - 1] || 0, stars);
  if (level === save.open && level < LEVELS) save.open = level + 1;
  persist();
  $('oTitle').textContent = level === LEVELS ? 'Все уровни пройдены!' : `Уровень ${level} пройден!`;
  $('oStars').classList.remove('hidden');
  $('oStars').innerHTML = [1, 2, 3].map((i) => `<span class="${i <= stars ? '' : 'off'}">★</span>`).join('');
  $('oScore').textContent = `+${eaten + goldGot * 3} 🍎`;
  $('oSub').textContent = stars < 3 ? 'Соберите оба золотых яблока, чтобы получить три звезды.' : 'Идеально!';
  $('coinRevive').classList.add('hidden'); $('adRevive').classList.add('hidden');
  $('oNext').classList.toggle('hidden', level >= LEVELS);
  renderBoard(null);
  setTimeout(() => show('over'), 300);
}

function revive() {
  revived = true;
  // Голова откатывается на клетку назад, змейка поворачивает в безопасную сторону.
  snake = prev.map((p) => ({ ...p }));
  const safe = [[1, 0], [0, 1], [-1, 0], [0, -1]].find(([x, y]) => {
    const h = { x: snake[0].x + x, y: snake[0].y + y };
    return h.x >= 0 && h.y >= 0 && h.x < N && h.y < N && !walls.has(h.y * N + h.x) && !snake.some((p) => p.x === h.x && p.y === h.y);
  });
  if (safe) dir = { x: safe[0], y: safe[1] };
  queue = []; effects.ghost = 3; prev = snake.map((p) => ({ ...p }));
  show(null); mode = 'play'; acc = 0; sdk?.game.start();
}

function renderBoard(r) {
  const el = $('board');
  if (!r || !sdk || sdk.environment.host !== 'gamely') { el.innerHTML = ''; return; }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const rows = r.entries.slice();
  for (const e of r.around || []) if (!rows.some((x) => x.rank === e.rank)) rows.push(e);
  const note = sdk.player.anonymous ? '<p class="note">Войдите на сайте, чтобы попасть в таблицу рекордов.</p>' : '';
  el.innerHTML = rows.length ? `<p class="note">Таблица рекордов</p><ol class="lb">${rows.map((e) =>
    `<li class="${e.me ? 'me' : ''}"><span>${e.rank}</span><span>${esc(e.name)}</span><span>${e.score}</span></li>`).join('')}</ol>${note}` : note;
}

// ---------- отрисовка ----------
const cv = $('c'), g = cv.getContext('2d');
let cell = 20, dpr = 1;
function resize() {
  const padH = matchMedia('(pointer:coarse)').matches ? 126 : 0;
  const size = Math.max(200, Math.min(innerWidth - 16, innerHeight - 70 - padH, 640));
  cell = Math.floor(size / N);
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = cell * N * dpr; cv.height = cell * N * dpr;
  cv.style.width = cv.style.height = `${cell * N}px`;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);

const skin = () => SKINS.find((s) => s.id === save.skin) || SKINS[0];
function segColor(sk, i, len) {
  if (sk.rainbow) return `hsl(${(i * 24 + performance.now() / 12) % 360} 85% 60%)`;
  if (sk.stripes) return i % 2 ? sk.body[1] : sk.body[0];
  const t = len > 1 ? i / (len - 1) : 0;
  const a = sk.body[0], b = sk.body[1];
  const mix = (x, y) => Math.round(parseInt(a.slice(x, y), 16) * (1 - t) + parseInt(b.slice(x, y), 16) * t);
  return `rgb(${mix(1, 3)},${mix(3, 5)},${mix(5, 7)})`;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); }

function draw(t) {
  const W = cell * N;
  g.fillStyle = '#161a3a'; g.fillRect(0, 0, W, W);
  g.fillStyle = '#1a1f45';
  for (let y = 0; y < N; y++) for (let x = (y % 2); x < N; x += 2) g.fillRect(x * cell, y * cell, cell, cell);
  if (!snake) return;
  // стены
  g.fillStyle = '#4b5287';
  for (const w of walls) { const x = w % N, y = Math.floor(w / N); rr(x * cell + 1, y * cell + 1, cell - 2, cell - 2, 5); }
  g.fillStyle = '#6b73b3';
  for (const w of walls) { const x = w % N, y = Math.floor(w / N); g.fillRect(x * cell + 3, y * cell + 2, cell - 6, 3); }
  // еда и бонусы: лёгкое покачивание
  const bob = Math.sin(performance.now() / 200) * cell * 0.06;
  const fruit = (p, emoji, scale = 0.8) => { g.font = `${cell * scale}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(emoji, p.x * cell + cell / 2, p.y * cell + cell / 2 + bob); };
  fruit(food, '🍎');
  if (gold) {
    g.save(); g.shadowColor = '#FFC531'; g.shadowBlur = 14; g.globalAlpha = gold.ttl < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 90)) : 1;
    fruit(gold, '🍏'); g.restore();
    g.strokeStyle = '#FFC531'; g.lineWidth = 2; g.beginPath(); g.arc(gold.x * cell + cell / 2, gold.y * cell + cell / 2, cell * 0.55, 0, Math.PI * 2); g.stroke();
  }
  if (bonus) {
    const b = BONUS[bonus.type];
    g.fillStyle = b.color; g.globalAlpha = 0.25; g.beginPath(); g.arc(bonus.x * cell + cell / 2, bonus.y * cell + cell / 2, cell * 0.6, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    fruit(bonus, b.icon, 0.7);
  }
  // змейка: плавно между клетками
  const sk = skin(), len = snake.length;
  const k = mode === 'play' ? Math.min(1, acc / curInterval()) : 1;
  g.globalAlpha = (sk.alpha || 1) * (effects.ghost > 0 ? 0.55 : 1);
  // Центры сегментов между старой и новой клеткой; тело — сплошная линия от хвоста к голове, тоньше к хвосту.
  const pts = snake.map((b, i) => { const a = prev[i] || b; return { x: (a.x + (b.x - a.x) * k) * cell + cell / 2, y: (a.y + (b.y - a.y) * k) * cell + cell / 2 }; });
  const width = (i) => cell * (0.78 - 0.3 * Math.min(1, i / Math.max(8, len)));
  g.lineCap = 'round';
  for (let i = len - 1; i >= 1; i--) {
    const p = pts[i], q = pts[i - 1];
    // Через край поля (после возрождения) не тянем линию.
    if (Math.abs(p.x - q.x) > cell * 1.5 || Math.abs(p.y - q.y) > cell * 1.5) continue;
    g.strokeStyle = segColor(sk, i, len); g.lineWidth = width(i);
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
  }
  g.fillStyle = sk.head;
  g.beginPath(); g.arc(pts[0].x, pts[0].y, cell * 0.45, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  // глаза
  const h0 = prev[0], h1 = snake[0];
  const hx = (h0.x + (h1.x - h0.x) * k) * cell + cell / 2, hy = (h0.y + (h1.y - h0.y) * k) * cell + cell / 2;
  const ex = -dir.y, ey = dir.x;
  for (const s of [-1, 1]) {
    const px = hx + dir.x * cell * 0.15 + ex * s * cell * 0.2, py = hy + dir.y * cell * 0.15 + ey * s * cell * 0.2;
    g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py, cell * 0.14, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#0f1226'; g.beginPath(); g.arc(px + dir.x * cell * 0.05, py + dir.y * cell * 0.05, cell * 0.07, 0, Math.PI * 2); g.fill();
  }
  // частицы
  for (const p of particles) {
    g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.color;
    g.fillRect(p.x * cell - 2, p.y * cell - 2, 4, 4);
  }
  g.globalAlpha = 1;
}

const curInterval = () => interval / (effects.slow > 0 ? 0.6 : 1);
function frame(t) {
  const dt = Math.min(100, t - (lastT || t)); lastT = t;
  if (mode === 'play') {
    acc += dt;
    for (const key of Object.keys(effects)) effects[key] -= dt / 1000;
    if (gold) { gold.ttl -= dt / 1000; if (gold.ttl <= 0) gold = null; }
    if (bonus) { bonus.ttl -= dt / 1000; if (bonus.ttl <= 0) bonus = null; }
    while (mode === 'play' && acc >= curInterval()) { acc -= curInterval(); step(); }
    if (Math.floor(t / 250) !== Math.floor((t - dt) / 250)) hud();
  }
  for (const p of particles) { p.x += p.vx * dt / 60; p.y += p.vy * dt / 60; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt / 600; }
  particles = particles.filter((p) => p.life > 0);
  draw(t);
  requestAnimationFrame(frame);
}

// ---------- экраны ----------
function show(id) {
  for (const s of ['menu', 'levels', 'skins', 'pause', 'over']) $(s).classList.toggle('hidden', s !== id);
}
function openMenu() {
  mode = 'menu'; sdk?.game.stop();
  $('mBest').textContent = save.best; $('mApples').textContent = save.apples;
  $('muteBtn').textContent = save.mute ? '🔇 Звук выкл' : '🔊 Звук вкл';
  show('menu');
}
function openLevels() {
  $('lvGrid').innerHTML = Array.from({ length: LEVELS }, (_, i) => {
    const n = i + 1, st = save.stars[i] || 0, locked = n > save.open;
    return `<button class="lv ${locked ? 'locked' : ''} ${n === save.open && !st ? 'next' : ''}" data-lv="${n}" ${locked ? 'disabled' : ''}>
      ${locked ? '🔒' : n}<small>${locked ? '' : '★'.repeat(st) + '☆'.repeat(3 - st)}</small></button>`;
  }).join('');
  show('levels');
}
function openSkins() {
  $('sApples').textContent = save.apples;
  $('skinGrid').innerHTML = SKINS.map((s) => {
    const own = save.skins.includes(s.id);
    return `<button class="skin ${save.skin === s.id ? 'on' : ''}" data-skin="${s.id}"><canvas width="72" height="18" data-prev="${s.id}"></canvas>
      ${s.name}<br>${own ? (save.skin === s.id ? '✓ выбран' : 'выбрать') : `🍎 ${s.price}`}</button>`;
  }).join('');
  for (const c of document.querySelectorAll('[data-prev]')) {
    const s = SKINS.find((k) => k.id === c.dataset.prev), x = c.getContext('2d');
    for (let i = 0; i < 4; i++) { x.globalAlpha = s.alpha || 1; x.fillStyle = i === 3 ? s.head : segColor(s, 3 - i, 4); x.beginPath(); x.roundRect ? x.roundRect(i * 18 + 1, 1, 16, 16, 6) : x.rect(i * 18 + 1, 1, 16, 16); x.fill(); }
  }
  show('skins');
}

$('toLevels').onclick = () => { audio(); openLevels(); };
$('toEndless').onclick = () => start('endless');
$('toSkins').onclick = openSkins;
$('muteBtn').onclick = () => { audio(); save.mute = !save.mute; persist(); openMenu(); };
document.querySelectorAll('[data-back]').forEach((b) => { b.onclick = openMenu; });
$('lvGrid').onclick = (e) => { const b = e.target.closest('[data-lv]'); if (b && !b.disabled) start('level', Number(b.dataset.lv)); };
$('skinGrid').onclick = (e) => {
  const b = e.target.closest('[data-skin]'); if (!b) return;
  const s = SKINS.find((k) => k.id === b.dataset.skin);
  if (!save.skins.includes(s.id)) {
    if (save.apples < s.price) { tone(160, 0.15, 'square', 0.05); b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 200); return; }
    save.apples -= s.price; save.skins.push(s.id); sfx.gold();
  }
  save.skin = s.id; persist(); openSkins();
};
function togglePause(on = mode === 'play') {
  if (on && mode === 'play') { mode = 'pause'; show('pause'); sdk?.game.stop(); }
  else if (!on && mode === 'pause') { mode = 'play'; show(null); lastT = 0; sdk?.game.start(); }
}
$('pauseBtn').onclick = () => togglePause();
$('resumeBtn').onclick = () => togglePause(false);
$('quitBtn').onclick = () => { persist(); openMenu(); };
$('oAgain').onclick = async () => {
  if (sdk && runs % 3 === 0) await sdk.ads.fullscreen().catch(() => {});
  start(kind, level);
};
$('oNext').onclick = () => start('level', Math.min(LEVELS, level + 1));
$('oMenu').onclick = openMenu;
$('coinRevive').textContent = `Продолжить за 🪙 ${REVIVE_COST}`;
$('coinRevive').onclick = async () => {
  $('coinRevive').disabled = true;
  try { const r = await sdk.coins.spend(REVIVE_COST, 'Продолжить змейку'); if (r.ok) revive(); }
  finally { $('coinRevive').disabled = false; }
};
$('adRevive').onclick = async () => {
  $('adRevive').disabled = true;
  try { const r = await sdk.ads.rewarded(); if (r.rewarded) revive(); }
  finally { $('adRevive').disabled = false; }
};

// ---------- управление ----------
const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
addEventListener('keydown', (e) => {
  if (KEYS[e.code] && mode === 'play') { e.preventDefault(); turn(...KEYS[e.code]); }
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if ((e.code === 'Space' || e.code === 'Enter') && mode === 'over' && !$('over').classList.contains('hidden')) $('oAgain').click();
});
let sx = 0, sy = 0, swiping = false;
addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; sx = e.clientX; sy = e.clientY; swiping = true; });
addEventListener('pointermove', (e) => {
  if (!swiping || mode !== 'play') return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.hypot(dx, dy) < 22) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  sx = e.clientX; sy = e.clientY;
});
addEventListener('pointerup', () => { swiping = false; });
const PAD = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
$('pad').addEventListener('pointerdown', (e) => { const b = e.target.closest('[data-d]'); if (b && mode === 'play') { e.preventDefault(); turn(...PAD[b.dataset.d]); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });
$('ctrlNote').textContent = matchMedia('(pointer:coarse)').matches ? 'Свайп по экрану или кнопки под полем.' : 'Стрелки или WASD. Esc — пауза.';

// ---------- запуск ----------
resize();
openMenu();
requestAnimationFrame(frame);
if (window.Gamely) Gamely.init().then(async (s) => {
  const d = await s.data.get().catch(() => null);
  applySave(d);
  sdk = s;
  if (!d || d.v !== 2) persist(); // переносим старое сохранение (только рекорд) в новый формат
  s.on('pause', () => togglePause(true));
  s.game.ready();
  if (mode === 'menu') openMenu();
}).catch(() => {});
</script>
</body>
</html>
