<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Огонёк</title>
<style>
*{box-sizing:border-box}
.hidden{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#05040a;color:#f5ead6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;display:flex;align-items:center;gap:10px;pointer-events:none}
#xp{position:fixed;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.08)}
#xp i{display:block;height:100%;width:0;background:#ffb547}
.pill{background:rgba(10,8,18,.72);border:1px solid rgba(255,181,71,.25);border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:480px){#hud{gap:6px;padding:10px 8px}.pill{font-size:13px;padding:5px 7px}#hp{width:70px}}
#hp{width:120px;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
#hp i{display:block;height:100%;background:#ff5d5d;transition:width .2s}
#pauseBtn{margin-left:auto;pointer-events:auto;border:1px solid rgba(255,181,71,.35);background:rgba(10,8,18,.72);color:#f5ead6;border-radius:10px;width:40px;height:36px;font:700 16px system-ui;cursor:pointer}
#inv{position:fixed;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px;max-width:180px;pointer-events:none}
#inv span{position:relative;width:32px;height:32px;border-radius:9px;background:rgba(10,8,18,.72);border:1px solid rgba(255,181,71,.2)}
#inv span.evo{border-color:#ffb547}
#inv canvas{width:30px;height:30px;display:block}
#inv b{position:absolute;right:1px;bottom:-1px;font-size:10px;color:#ffd38a}
#banner{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;transition:opacity .5s;opacity:0}
#banner.on{opacity:1}
#banner b{display:block;font-size:30px;color:#ffb547;letter-spacing:-.01em}
#banner small{font-size:15px;color:#d8cab2}
.scr{position:fixed;inset:0;background:rgba(5,4,10,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#menu{background:rgba(5,4,10,.35)}
.card{background:#15111f;border:1px solid rgba(255,181,71,.18);border-radius:18px;padding:22px;width:min(460px,100%);max-height:94vh;overflow:auto;text-align:center}
h1{font-size:44px;margin:0 0 4px;color:#ffb547;letter-spacing:-.01em}
h2{font-size:26px;margin:0 0 8px}
.sub{color:#bcae96;margin:0 0 16px;font-size:15px;line-height:1.4}
.btn{display:block;width:100%;margin:8px 0;padding:14px;border:0;border-radius:12px;font:800 17px system-ui;cursor:pointer;color:#1b1206;background:#ffb547;box-shadow:0 4px 0 #9a5b0c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a5b0c}
.btn.alt{background:#2a2238;color:#f5ead6;box-shadow:0 4px 0 #0e0b15}
.btn:disabled{opacity:.45;cursor:default}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.hero{border:1px solid rgba(255,181,71,.18);background:#1f1830;color:#f5ead6;border-radius:14px;padding:8px 4px;cursor:pointer;font:inherit}
.hero.on{border-color:#ffb547;background:#2b2140}
.hero.locked{opacity:.55}
.hero canvas{width:48px;height:56px;display:block;margin:0 auto 4px}
.hero b{display:block;font-size:13px;line-height:1.2}
.hero small{display:block;color:#bcae96;font-size:11px;margin-top:2px}
#heroText{min-height:38px;margin:4px 0 8px;font-size:14px}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid rgba(255,181,71,.25);background:#1f1830;color:#f5ead6;border-radius:14px;padding:12px;cursor:pointer;font:inherit}
.choice:hover{border-color:#ffb547;background:#271e3c}
.choice.evo{border-color:#ffb547}
.choice canvas{width:44px;height:44px}
.choice b{display:block;font-size:16px}
.choice small{display:block;color:#bcae96;font-size:13px;line-height:1.35}
.choice em{display:block;font-style:normal;color:#ffb547;font-size:12px;font-weight:700;margin:1px 0 2px}
.choice i{display:block;font-style:normal;color:#8f8299;font-size:12px;margin-top:3px}
.shop{display:grid;gap:8px;margin:12px 0;text-align:left}
.up{display:flex;align-items:center;gap:10px;background:#1f1830;border-radius:12px;padding:10px 12px}
.up div{flex:1}
.up b{display:block;font-size:15px}.up small{color:#bcae96;font-size:12px}
.up button{border:0;border-radius:10px;padding:8px 10px;font:700 13px system-ui;background:#ffb547;color:#1b1206;cursor:pointer;min-width:88px}
.up button:disabled{background:#2a2238;color:#7c6f8f;cursor:default}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 14px}
.stats div{background:#1f1830;border-radius:12px;padding:10px}
.stats b{display:block;font-size:24px;color:#ffb547}
.stats small{color:#bcae96;font-size:12px}
.kit{display:grid;gap:6px;margin:0 0 12px;text-align:left}
.kit div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:#1f1830;border-radius:10px;padding:6px 10px}
.kit canvas{width:30px;height:30px}
.kit b{font-size:14px}.kit small{display:block;color:#8f8299;font-size:12px}
.note{color:#8f8299;font-size:13px;margin:10px 0 0;line-height:1.4}
.lb{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:14px}
.lb li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:5px 8px;border-radius:8px}
.lb li.me{background:#2a2238;font-weight:700}
#boss{position:fixed;left:50%;top:52px;transform:translateX(-50%);width:min(420px,80vw);text-align:center;font-weight:800;font-size:13px;color:#ffb3b3;pointer-events:none}
#boss div{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
#boss i{display:block;height:100%;background:#ff5d5d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="xp"><i id="xpBar"></i></div>
<div id="hud" class="hidden">
  <div id="hp"><i id="hpBar"></i></div>
  <span class="pill" id="hTime">0:00</span>
  <span class="pill" id="hLvl">Ур. 1</span>
  <span class="pill" id="hKills">0</span>
  <button id="pauseBtn" aria-label="Пауза">II</button>
</div>
<div id="inv" class="hidden"></div>
<div id="boss" class="hidden">Хозяин тьмы<div><i id="bossBar"></i></div></div>
<div id="banner"><b id="bTitle"></b><small id="bSub"></small></div>

<div class="scr" id="menu"><div class="card">
  <h1>Огонёк</h1>
  <p class="sub">Ночь в лесу, вокруг поднимаются тени. Огонёк сражается сам — уводите его от толпы, зажигайте фонари, ищите сундуки и дотяните до рассвета.</p>
  <div class="heroes" id="heroes"></div>
  <p class="note" id="heroText"></p>
  <button class="btn" id="playBtn">Зажечься</button>
  <button class="btn alt" id="shopBtn">Улучшения</button>
  <button class="btn alt" id="muteBtn"></button>
  <p class="note" id="mBest"></p>
  <p class="note" id="ctrlNote"></p>
</div></div>

<div class="scr hidden" id="shop"><div class="card">
  <h2>Улучшения</h2>
  <p class="sub">Угольки остаются после каждой ночи. Сейчас: <b id="sEmbers">0</b></p>
  <div class="shop" id="shopList"></div>
  <button class="btn alt" data-back>Назад</button>
</div></div>

<div class="scr hidden" id="level"><div class="card">
  <h2>Огонёк вырос</h2>
  <p class="sub">Выберите одно</p>
  <div class="choices" id="choices"></div>
</div></div>

<div class="scr hidden" id="chest"><div class="card">
  <h2 id="cTitle">Сундук</h2>
  <div class="choices" id="cList"></div>
  <button class="btn" id="cTake">Забрать</button>
</div></div>

<div class="scr hidden" id="pause"><div class="card">
  <h2>Пауза</h2>
  <div class="stats" id="pStats"></div>
  <div class="kit" id="pKit"></div>
  <button class="btn" id="resumeBtn">Продолжить</button>
  <button class="btn alt" id="quitBtn">Сдаться</button>
</div></div>

<div class="scr hidden" id="over"><div class="card">
  <h2 id="oTitle">Огонёк погас</h2>
  <div class="stats" id="oStats"></div>
  <button class="btn hidden" id="coinRevive">Разгореться снова за 10 монеток</button>
  <button class="btn alt hidden" id="adRevive">Разгореться снова за рекламу</button>
  <button class="btn" id="againBtn">Ещё ночь</button>
  <button class="btn alt" id="menuBtn">В меню</button>
  <div id="board"></div>
</div></div>

<script src="../../sdk/v1.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const lc = document.createElement('canvas'), lctx = lc.getContext('2d'); // карта света
let W = 0, H = 0, dpr = 1, zoom = 1;

// ---------- 2.5D ----------
// Мир — плоскость (x, y). Камера смотрит под 45°: глубина сжимается в TILT раз, высота z поднимает точку на экране.
// Спрайты сняты в Blender той же камерой (scripts/blender/ogonek.py), точка опоры у всех в одном месте кадра.
const TILT = Math.SQRT1_2, LIFT = Math.SQRT1_2, U = 28, AY = 0.5 + 0.28 * LIFT;
const SPR = { shade_0: 1.9, shade_1: 1.9, bat_0: 2, bat_1: 2, ghost: 2, golem: 2.6, boss: 4, tree_0: 4.4, tree_1: 4.4, tree_2: 4.4, stump: 1.6, rock: 1.6, shroom: 1.2, lantern: 1.9, lanternon: 1.9, chest: 1.7, gem: 0.8, gemb: 0.8, coal: 0.8 };
const img = {}, bright = {};
let assetsReady = false;
function loadAssets() {
  return Promise.all([...Object.keys(SPR), 'ground'].map((n) => new Promise((res) => { const i = new Image(); i.onload = () => { img[n] = i; res(); }; i.onerror = res; i.src = `img/${n}.webp`; })));
}
// Светлая копия спрайта для вспышки при попадании; тень (чёрные пиксели) не трогаем.
function brightOf(n) {
  if (n in bright) return bright[n];
  const i = img[n], c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
  const x = c.getContext('2d'); x.drawImage(i, 0, 0);
  try {
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let k = 0; k < p.length; k += 4) { if (p[k] + p[k + 1] + p[k + 2] < 10) { p[k + 3] = 0; continue; } p[k] = 255 - (255 - p[k]) * 0.2; p[k + 1] = 255 - (255 - p[k + 1]) * 0.2; p[k + 2] = 255 - (255 - p[k + 2]) * 0.2; }
    x.putImageData(d, 0, 0); return (bright[n] = c);
  } catch (e) { return (bright[n] = null); }
}
function sprite(n, x, y, z = 0, k = 1, alpha = 1, flash = 0) {
  const i = img[n]; if (!i) return;
  const s = SPR[n] * U * k, px = x - s / 2, py = y * TILT - s * AY - z;
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.drawImage(i, px, py, s, s);
  if (flash > 0) { const b = brightOf(n); if (b) { ctx.globalAlpha = alpha * flash; ctx.drawImage(b, px, py, s, s); } }
  ctx.globalAlpha = 1;
}
// Точка модели Blender (bx, by, bz) относительно опоры → смещение на экране.
const up = (by, bz) => (by * TILT + bz * LIFT) * U;

// ---------- справочники ----------
const WEAPONS = {
  bolt: { name: 'Искра', text: 'Летит в ближайшую тень', max: 6 },
  orbit: { name: 'Хоровод', text: 'Угольки кружат вокруг огонька', max: 6 },
  nova: { name: 'Вспышка', text: 'Волна жара отбрасывает всех рядом', max: 6 },
  chain: { name: 'Молния', text: 'Перескакивает с тени на тень', max: 6 },
  comet: { name: 'Комета', text: 'Падает с неба и выжигает круг', max: 6 },
};
const PASSIVES = {
  speed: { name: 'Ветер', text: 'Огонёк быстрее на 10%', max: 5 },
  magnet: { name: 'Тяга', text: 'Искры летят к огоньку издалека', max: 5 },
  power: { name: 'Жар', text: 'Урон всего оружия +15%', max: 5 },
  haste: { name: 'Ритм', text: 'Оружие перезаряжается на 8% быстрее', max: 5 },
  heart: { name: 'Сердцевина', text: 'Запас сил +20 и лечение', max: 5 },
  light: { name: 'Сияние', text: 'Огонёк освещает больше леса', max: 5 },
};
// Оружие шестого уровня в паре с нужным умением превращается в сундуке.
const EVO = {
  bolt: { need: 'haste', name: 'Рой искр', text: 'Искры летят сразу в три цели и пробивают всех насквозь' },
  orbit: { need: 'heart', name: 'Солнце', text: 'Девять угольков по широкому кругу, огонёк понемногу лечится' },
  nova: { need: 'power', name: 'Сверхновая', text: 'Вспышка вдвое сильнее и в полтора раза шире' },
  chain: { need: 'light', name: 'Гроза', text: 'Две молнии сразу, каждая скачет дальше' },
  comet: { need: 'magnet', name: 'Звездопад', text: 'Пять комет за раз' },
};
const HEROES = {
  ogonek: { name: 'Огонёк', text: 'Начинает с Искры. Ровный во всём.', cost: 0, hp: 100, speed: 150, start: 'bolt', pal: ['#ff6a10', '#ffb547', '#fff1c4', '#2a1405'], glow: '255,150,60' },
  zarnitsa: { name: 'Зарница', text: 'Начинает с Молнии. Быстрее всех, но хрупкая.', cost: 150, hp: 80, speed: 172, start: 'chain', pal: ['#2f6bff', '#7fc4ff', '#eef8ff', '#0b1a3a'], glow: '110,170,255' },
  bolotny: { name: 'Болотный', text: 'Начинает со Вспышки. Крепкий и светит дальше, но медленный.', cost: 300, hp: 130, speed: 136, start: 'nova', light: 50, pal: ['#14946c', '#5fe0a6', '#e8fff3', '#06261a'], glow: '90,230,170' },
};
const META = [
  { id: 'hp', name: 'Крепкое пламя', text: '+10 к запасу сил', cost: (l) => 30 + l * 30, max: 5 },
  { id: 'dmg', name: 'Горячее сердце', text: '+8% урона', cost: (l) => 40 + l * 40, max: 5 },
  { id: 'spd', name: 'Лёгкость', text: '+5% скорости', cost: (l) => 30 + l * 35, max: 5 },
  { id: 'mag', name: 'Притяжение', text: 'Искры притягиваются сильнее', cost: (l) => 25 + l * 25, max: 5 },
  { id: 'xp', name: 'Мудрость', text: '+10% опыта за искры', cost: (l) => 50 + l * 50, max: 5 },
  { id: 'start', name: 'Второй огонь', text: 'Начинать с хороводом угольков', cost: () => 300, max: 1 },
];
// eye: [dx, by, bz, r] в единицах модели — по ним светятся глаза в темноте
const ENEMY = {
  shade: { hp: 12, speed: 52, r: 13, dmg: 8, xp: 1, spr: ['shade_0', 'shade_1'], eye: [0.16, -0.42, 0.62, 0.07], eyeC: '255,211,138', smoke: '#5b4790' },
  bat: { hp: 7, speed: 105, r: 10, dmg: 6, xp: 1, spr: ['bat_0', 'bat_1'], fly: 14, eye: [0.08, -0.2, 0.8, 0.045], eyeC: '255,211,138', smoke: '#6a4a8f' },
  ghost: { hp: 28, speed: 44, r: 14, dmg: 12, xp: 3, spr: ['ghost'], fly: 6, glow: true, smoke: '#a9b8e0' },
  brute: { hp: 120, speed: 34, r: 22, dmg: 20, xp: 8, spr: ['golem'], eye: [0.12, -0.38, 1.58, 0.06], eyeC: '255,140,64', smoke: '#6b6478' },
  boss: { hp: 2200, speed: 46, r: 40, dmg: 30, xp: 60, spr: ['boss'], k: 1.5, fly: 0, eye: [0.17, -0.4, 2.2, 0.08], eyeC: '255,70,70', smoke: '#3a2560' },
};
const FLYING = { bat: 1, ghost: 1, boss: 1 };

// ---------- сохранение ----------
let save = { v: 1, embers: 0, meta: {}, best: 0, bestKills: 0, mute: false, hero: 'ogonek', heroes: ['ogonek'], dawns: 0 };
let sdk = null;
const persist = () => { if (sdk) sdk.data.set(save).catch(() => {}); };
function applySave(d) {
  if (!d || typeof d !== 'object' || d.v !== 1) return;
  if (Number.isInteger(d.embers)) save.embers = Math.max(0, d.embers);
  if (d.meta && typeof d.meta === 'object') for (const m of META) if (Number.isInteger(d.meta[m.id])) save.meta[m.id] = Math.min(m.max, Math.max(0, d.meta[m.id]));
  if (typeof d.best === 'number' && isFinite(d.best)) save.best = Math.max(0, Math.floor(d.best));
  if (Number.isInteger(d.bestKills)) save.bestKills = d.bestKills;
  if (Array.isArray(d.heroes)) save.heroes = ['ogonek', ...d.heroes.filter((h) => h !== 'ogonek' && HEROES[h])];
  if (HEROES[d.hero] && save.heroes.includes(d.hero)) save.hero = d.hero;
  if (Number.isInteger(d.dawns)) save.dawns = Math.max(0, d.dawns);
  save.mute = !!d.mute;
}
const meta = (id) => save.meta[id] || 0;

// ---------- звук ----------
let ac = null;
function audio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); }
let lastTone = 0;
function tone(f, d = 0.06, type = 'triangle', vol = 0.04, slide = 0) {
  if (save.mute || !ac) return;
  const now = ac.currentTime; if (now - lastTone < 0.012) return; lastTone = now;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, now + d);
  g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + d); o.connect(g).connect(ac.destination); o.start(now); o.stop(now + d);
}

// ---------- лес ----------
// Мир бесконечный и нарезан на клетки: деревья, камни и фонари в каждой клетке зависят только от зерна ночи.
const CH = 360;
const chunks = new Map();
let worldSeed = 1;
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function chunk(i, j) {
  const key = (i + 30000) * 60000 + (j + 30000);
  let c = chunks.get(key); if (c) return c;
  const r = rng((Math.imul(i, 73856093) ^ Math.imul(j, 19349663) ^ worldSeed) | 0);
  c = [];
  const free = (x, y, d) => Math.hypot(x, y) > 190 && c.every((o) => (o.x - x) ** 2 + (o.y - y) ** 2 > d * d);
  if (r() < 0.1) { const x = i * CH + 90 + r() * (CH - 180), y = j * CH + 90 + r() * (CH - 180); if (free(x, y, 0)) c.push({ t: 'lantern', x, y, r: 6, id: key, dt: 'p' }); }
  const n = 2 + Math.floor(r() * 3);
  for (let k = 0; k < n; k++) {
    const x = i * CH + r() * CH, y = j * CH + r() * CH, q = r();
    const p = q < 0.36 ? { t: 'tree', s: 'tree_0', r: 11 } : q < 0.62 ? { t: 'tree', s: 'tree_1', r: 12 } : q < 0.76 ? { t: 'bush', s: 'tree_2', r: 19 } : q < 0.9 ? { t: 'rock', s: 'rock', r: 15 } : { t: 'stump', s: 'stump', r: 12 };
    if (free(x, y, 80)) c.push(Object.assign(p, { x, y, dt: 'p' }));
  }
  const m = r() < 0.75 ? 0 : 1 + Math.floor(r() * 2);
  for (let k = 0; k < m; k++) { const x = i * CH + r() * CH, y = j * CH + r() * CH; if (free(x, y, 30)) c.push({ t: 'shroom', s: 'shroom', x, y, r: 0, dt: 'p' }); }
  if (chunks.size > 900) chunks.clear();
  chunks.set(key, c);
  return c;
}
function forChunks(x0, y0, x1, y1, fn) {
  const i0 = Math.floor(x0 / CH), i1 = Math.floor(x1 / CH), j0 = Math.floor(y0 / CH), j1 = Math.floor(y1 / CH);

  for (const s of shots) { ctx.fillStyle = hero.pal[2]; ctx.beginPath(); ctx.arc(s.x, s.y * TILT - 16, 4, 0, 7); ctx.fill(); }
  for (const o of orbitPositions()) { ctx.fillStyle = hero.pal[0]; ctx.beginPath(); ctx.arc(o.x, o.y * TILT - o.z, 8, 0, 7); ctx.fill(); ctx.fillStyle = hero.pal[2]; ctx.beginPath(); ctx.arc(o.x - 1.5, o.y * TILT - o.z - 1.5, 3.5, 0, 7); ctx.fill(); }
  for (const o of eshots) if (vis(o.x, o.y)) {
    ellipseShadow(o.x, o.y, 6, 0.3);
    ctx.fillStyle = 'rgba(150,60,220,.35)'; ctx.beginPath(); ctx.arc(o.x, o.y * TILT - 14, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a0d2a'; ctx.beginPath(); ctx.arc(o.x, o.y * TILT - 14, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c070ff'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  ctx.save(); ctx.translate(hero.x, hero.y * TILT); ctx.scale(1, TILT); glow(0, 0, 38, hero.glow, 0.45); ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  if (!(hero.inv > 0 && state === 'play' && Math.floor(t * 20) % 2)) drawFlame(ctx, hero.x, hero.y * TILT - 3 - Math.sin(t * 4) * 2, 1.35, hero.pal, t, hero.dir);
  // молнии, волны, частицы
  for (const f of fx) {
    if (f.ring) {

      ctx.beginPath(); ctx.ellipse(f.x, f.y * TILT, f.r, f.r * TILT, 0, 0, 7); ctx.stroke();
    } else if (f.bolt) {

// Значки улучшений рисуются тем же языком, что и сама игра.
function drawIcon(c, k, s, evo) {
  c.clearRect(0, 0, s, s); c.save(); c.translate(s / 2, s / 2); c.scale(s / 44, s / 44);
  c.fillStyle = evo ? '#4a2c12' : '#2a2238'; c.beginPath(); c.arc(0, 0, 21, 0, 7); c.fill();
  if (evo) { c.strokeStyle = '#ffb547'; c.lineWidth = 2; c.stroke(); }

  if (k === 'comet') { c.fillStyle = hot; c.beginPath(); c.arc(5, 5, 7, 0, 7); c.fill(); c.strokeStyle = amber; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(-12, -12); c.moveTo(4, -3); c.lineTo(-6, -14); c.stroke(); }
  if (k === 'speed') { c.strokeStyle = pale; c.lineWidth = 3; for (const y of [-8, 0, 8]) { c.beginPath(); c.moveTo(-12, y); c.lineTo(12 - Math.abs(y), y); c.stroke(); } }
  if (k === 'magnet') { c.strokeStyle = '#ff5d5d'; c.lineWidth = 5; c.beginPath(); c.arc(0, -2, 9, Math.PI, 0); c.stroke(); c.strokeStyle = pale; c.beginPath(); c.moveTo(-9, -2); c.lineTo(-9, 8); c.moveTo(9, -2); c.lineTo(9, 8); c.stroke(); }
  if (k === 'power') { c.fillStyle = hot; c.beginPath(); c.moveTo(0, -14); c.quadraticCurveTo(12, 0, 0, 13); c.quadraticCurveTo(-12, 0, 0, -14); c.fill(); c.fillStyle = pale; c.beginPath(); c.arc(0, 4, 4, 0, 7); c.fill(); }

}
function renderInv() {
  const items = [...Object.keys(weapons).map((k) => ({ k, l: weapons[k], evo: evolved[k] })), ...Object.keys(passives).map((k) => ({ k, l: passives[k] }))];
  $('inv').innerHTML = items.map((o) => `<span class="${o.evo ? 'evo' : ''}"><canvas width="60" height="60" data-icon="${o.k}" ${o.evo ? 'data-evo="1"' : ''}></canvas><b>${o.evo ? '' : o.l}</b></span>`).join('');

}
function kitHTML() {
  const rows = [];
  for (const [k, l] of Object.entries(weapons)) rows.push(`<div><canvas width="60" height="60" data-icon="${k}" ${evolved[k] ? 'data-evo="1"' : ''}></canvas><span><b>${evolved[k] ? EVO[k].name : `${WEAPONS[k].name}, ${l} из 6`}</b><small>${evolved[k] ? EVO[k].text : `Превращение: 6 уровень и «${PASSIVES[EVO[k].need].name}», затем сундук`}</small></span></div>`);
  for (const [k, l] of Object.entries(passives)) rows.push(`<div><canvas width="60" height="60" data-icon="${k}"></canvas><span><b>${PASSIVES[k].name}, ${l} из 5</b><small>${PASSIVES[k].text}</small></span></div>`);
  return rows.join('');
}

function hud() {
  $('hpBar').style.width = `${Math.max(0, hero.hp / hero.maxHp * 100)}%`;
  $('xpBar').style.width = `${xp / xpNeed * 100}%`;
  $('hTime').textContent = mmss(time);
  $('hLvl').textContent = `Ур. ${lvl}`;
  $('hKills').textContent = `Тени ${kills}`;
  if (boss) $('bossBar').style.width = `${Math.max(0, boss.hp / boss.max * 100)}%`;
}
let bannerTimer = 0;
function banner(title, sub) {
  $('bTitle').textContent = title; $('bSub').textContent = sub || '';
  $('banner').classList.add('on'); clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $('banner').classList.remove('on'), 3200);
}

let last = 0, dtDraw = 0.016;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now; dtDraw = dt || 0.016;
  try {
    if (state === 'play') update(dt);
    else if (state === 'menu' && hero) { hero.spark += dt * 18; while (hero.spark > 1) { hero.spark--; fx.push({ p: 1, add: 1, x: hero.x + (Math.random() - 0.5) * 14, y: hero.y, z: 26 + Math.random() * 10, vx: (Math.random() - 0.5) * 20, vy: 0, vz: 50 + Math.random() * 30, life: 0.5, max: 0.5, c: hero.pal[1], s: 2.5 }); } for (const f of fx) { f.life -= dt; f.x += f.vx * dt; f.z += f.vz * dt; } fx = fx.filter((f) => f.life > 0); }
    draw();
  } catch (e) { window.__err = String(e && e.stack || e); }
}

// ---------- экраны ----------
function show(id) { for (const s of ['menu', 'shop', 'level', 'chest', 'pause', 'over']) $(s).classList.toggle('hidden', s !== id); }
function openMenu() {
  state = 'menu'; sdk?.game.stop();
  $('hud').classList.add('hidden'); $('inv').classList.add('hidden'); $('boss').classList.add('hidden'); $('banner').classList.remove('on');
  // в меню — тихий лес вокруг огонька выбранного цвета
  worldSeed = 7; chunks.clear(); hero = makeHero(); camX = 0; camY = 0; enemies = []; shots = []; eshots = []; gems = []; embers = []; chests = []; fx = []; decals = []; lit = new Set(); litList = []; weapons = {}; passives = {}; evolved = {}; time = 0; darkUntil = 0; boss = null;
  $('muteBtn').textContent = save.mute ? 'Включить звук' : 'Выключить звук';
  $('mBest').textContent = (save.best ? `Лучшая ночь: ${mmss(save.best)}. ` : '') + `Угольков в запасе: ${save.embers}` + (save.dawns ? `. Рассветов встречено: ${save.dawns}` : '');
  renderHeroes();
  show('menu');
}
function renderHeroes() {
  $('heroes').innerHTML = Object.entries(HEROES).map(([id, h]) => {
    const own = save.heroes.includes(id);
    return `<button class="hero ${save.hero === id ? 'on' : ''} ${own ? '' : 'locked'}" data-hero="${id}"><canvas width="96" height="112"></canvas><b>${h.name}</b><small>${own ? (save.hero === id ? 'выбран' : 'открыт') : `${h.cost} угольков`}</small></button>`;
  }).join('');
  $('heroes').querySelectorAll('[data-hero]').forEach((b) => { const c = b.querySelector('canvas').getContext('2d'); c.clearRect(0, 0, 96, 112); drawFlame(c, 48, 104, 2, HEROES[b.dataset.hero].pal, 0.3, 0); });
  const h = H_();
  $('heroText').textContent = `${h.name}: ${h.text}`;
}
$('heroes').onclick = (e) => {
  const b = e.target.closest('[data-hero]'); if (!b) return;
  const id = b.dataset.hero, h = HEROES[id];
  if (!save.heroes.includes(id)) {
    if (save.embers < h.cost) { $('heroText').textContent = `${h.name}: ${h.text} Откроется за ${h.cost} угольков, сейчас ${save.embers}.`; return; }
    save.embers -= h.cost; save.heroes.push(id); tone(880, 0.12); tone(1320, 0.2);

};
function openShop() {

    const l = meta(m.id), max = l >= m.max, cost = m.cost(l);
    return `<div class="up"><div><b>${m.name}${m.max > 1 ? ` ${l}/${m.max}` : ''}</b><small>${m.text}</small></div>

$('shopList').onclick = (e) => {
  const b = e.target.closest('[data-buy]'); if (!b || b.disabled) return;
  const m = META.find((x) => x.id === b.dataset.buy), cost = m.cost(meta(m.id));

};
function togglePause(on = state === 'play') {

  else if (!on && state === 'pause') { state = 'play'; show(null); last = 0; sdk?.game.start(); }
}
$('playBtn').onclick = newRun;

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (state === 'level' && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) document.querySelector(`#choices [data-i="${e.code.slice(-1) - 1}"]`)?.click();
  if (state === 'chest' && (e.code === 'Enter' || e.code === 'Space')) $('cTake').click();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
