# Продакшен на VPS: приложение + Caddy (HTTPS-сертификат Let's Encrypt выпускается сам).
# Запуск: заполните .env (см. .env.example) и выполните `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    # Все настройки из .env: реклама, контакты, счётчик. Ниже — обязательные и неизменяемые.
    env_file: .env
    environment:
      ADMIN_EMAILS: ${ADMIN_EMAILS:?укажите ADMIN_EMAILS в .env}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
    volumes:
      - igrodrom-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  igrodrom-data:
  caddy-data:
  caddy-config:
