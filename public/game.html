<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игра — Игродром</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w top-in">
  <a class="logo" href="index.html" aria-label="Игродром, на главную"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1C2140"/><circle cx="16" cy="16" r="10.5" fill="#FFC531"/><path d="M13.2 10.9 21.6 16l-8.4 5.1z" fill="#1C2140"/></svg><span>Игродром</span></a>
  <form class="search" id="searchForm" action="index.html" role="search">
    <input id="q" name="q" type="search" placeholder="Найти игру…" autocomplete="off" aria-label="Поиск игр">
  </form>
  <a class="btn" id="login" href="login.html">Войти</a>
</div></header>

<main class="w" id="page">
  <div class="empty" id="loading">Загрузка…</div>

  <article id="game" class="hidden">
    <div class="game-head">
      <div id="icon"></div>
      <div>
        <h1 id="title"></h1>
        <div class="game-sub"><span id="author"></span><a id="category"></a><span id="score"></span></div>
      </div>
    </div>

    <div class="player" id="player">
      <div class="splash" id="splash">
        <div class="splash-bg" id="splashBg"></div>
        <div class="splash-in">
          <div id="splashIcon"></div>
          <p class="splash-title" id="splashTitle"></p>
          <button class="btn play-btn" id="play">Играть</button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <span id="votes" class="hidden">
        <button class="btn sm" id="like" aria-pressed="false" title="Нравится">👍 <span id="likes">0</span></button>
        <button class="btn sm" id="dislike" aria-pressed="false" title="Не нравится">👎 <span id="dislikes">0</span></button>
      </span>
      <span class="spacer"></span>
      <button class="btn sm" id="share">Поделиться</button>
      <button class="btn sm" id="full">Во весь экран</button>
    </div>

    <p class="save-hint hidden" id="saveHint"></p>

    <div class="info">
      <div class="panel">
        <h3>Об игре</h3><p id="desc"></p>
        <h3>Как играть</h3><p id="howto"></p>
      </div>
      <div class="panel">
        <h3>Информация</h3>
        <dl class="facts" id="facts"></dl>
      </div>
    </div>

    <section class="sec"><div class="sec-head"><h2>Похожие игры</h2></div><div class="row-scroll" id="similar"></div></section>
  </article>
</main>

<footer><div class="w">
  <nav><a href="index.html">Каталог игр</a><a href="developers.html">Разработчикам</a><a href="cabinet.html">Кабинет разработчика</a></nav>
  <div>© Игродром</div>
</div></footer>

<script src="app.js"></script>
<script src="sdk-host.js"></script>
<script>
const { $, esc, fmt, loadCatalog, rating, cardHTML, iconHTML, initHeader, toast } = Igr;
const id = new URLSearchParams(location.search).get('id');
initHeader();

let game, live;

function notFound() {
  $('loading').innerHTML = `<h1 class="empty-title">Такой игры нет в каталоге</h1>
    <p>Возможно, её сняли с публикации или в ссылке опечатка.</p><a class="btn primary" href="index.html">Открыть каталог</a>`;
}

async function load() {
  const cat = await loadCatalog();
  live = cat.live;
  game = cat.games.find((g) => g.id === id);
  if (!game) return notFound();
  if (live) {
    // Полная карточка: описание, правила, своя оценка.
    try {
      const r = await fetch(`/api/games/${encodeURIComponent(id)}`);
      if (r.ok) game = { ...game, ...(await r.json()).game };
    } catch {}
  }
  render(cat.games);
}

function render(all) {
  document.title = `${game.title} — играть онлайн бесплатно | Игродром`;
  $('loading').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('icon').innerHTML = iconHTML(game);
  $('title').textContent = game.title;
  $('author').textContent = game.author || '';
  $('category').textContent = game.genre;
  $('category').href = `index.html?category=${encodeURIComponent(game.genre)}`;
  // Заставка: размытая обложка фоном, поверх — иконка, название и «Играть».
  if (game.cover_url) $('splashBg').innerHTML = `<img src="${esc(game.cover_url)}" alt="" onerror="this.remove()">`;
  $('splashIcon').innerHTML = iconHTML(game, 'game-icon big');
  $('splashTitle').textContent = game.title;
  $('desc').textContent = game.description || 'Описание пока не добавлено.';
  $('howto').textContent = game.how_to_play || 'Правила пока не добавлены.';
  renderScore();

  const facts = [
    ['Категория', esc(game.genre)],
    ['Возраст', esc(game.age || '0+')],
    ['Разработчик', esc(game.author || '—')],
    ['Платформы', 'Компьютер, телефон, планшет'],
    live && game.created_at ? ['Добавлена', new Date(game.created_at).toLocaleDateString('ru-RU')] : null,
    live ? ['Запусков', fmt(game.plays || 0)] : null,
  ].filter(Boolean);
  $('facts').innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  const others = all.filter((g) => g.id !== game.id);
  const similar = [...others.filter((g) => g.genre === game.genre), ...others.filter((g) => g.genre !== game.genre)].slice(0, 10);
  $('similar').innerHTML = similar.map(cardHTML).join('');
  $('votes').classList.toggle('hidden', !live);
  // Гостю — подсказка: прогресс сейчас живёт только в этом браузере.
  if (live) Igr.me().then((user) => {
    if (user) return;
    const next = encodeURIComponent(`game.html?id=${game.id}`);
    $('saveHint').innerHTML = `Прогресс сохраняется в этом браузере. <a href="login.html?next=${next}">Войдите</a>, чтобы он был доступен на всех ваших устройствах.`;
    $('saveHint').classList.remove('hidden');
  });
}

function renderScore() {
  const r = rating(game);
  $('score').textContent = r !== null ? `👍 ${r}% из ${fmt(game.likes + game.dislikes)} оценок` : '';
  $('likes').textContent = fmt(game.likes || 0);
  $('dislikes').textContent = fmt(game.dislikes || 0);
  $('like').classList.toggle('on', game.my_vote === 1);
  $('dislike').classList.toggle('on', game.my_vote === -1);
  $('like').setAttribute('aria-pressed', game.my_vote === 1);
  $('dislike').setAttribute('aria-pressed', game.my_vote === -1);
}

// ---------- игра ----------
let session = null;
$('play').onclick = () => {
  const frame = document.createElement('iframe');
  // SDK-хост слушает до загрузки игры, чтобы не пропустить её первое сообщение.
  IgrodromHost.attach(frame, { gameId: game.id, live });
  frame.src = game.src;
  frame.title = game.title;
  frame.setAttribute('sandbox', 'allow-scripts allow-pointer-lock');
  frame.setAttribute('allow', 'fullscreen; autoplay');
  $('splash').replaceWith(frame);
  frame.focus();
  if (live) startSession();
};

// Время считается, только пока вкладка видна.
function startSession() {
  fetch(`/api/games/${game.id}/play`, { method: 'POST' }).catch(() => {});
  session = { visibleMs: 0, since: document.hidden ? null : Date.now() };
}
function endSession() {
  if (!session) return;
  if (session.since) session.visibleMs += Date.now() - session.since;
  navigator.sendBeacon(`/api/games/${game.id}/play-end`,
    new Blob([JSON.stringify({ seconds: Math.round(session.visibleMs / 1000) })], { type: 'application/json' }));
  session = null;
}
document.addEventListener('visibilitychange', () => {
  if (!session) return;
  if (document.hidden && session.since) { session.visibleMs += Date.now() - session.since; session.since = null; }
  if (!document.hidden && !session.since) session.since = Date.now();
});
addEventListener('pagehide', endSession);

$('full').onclick = () => {
  const el = $('player');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast('Браузер не разрешил полноэкранный режим'));
  else toast('Полноэкранный режим не поддерживается');
};

$('share').onclick = async () => {
  const url = location.href;
  if (navigator.share) { navigator.share({ title: game.title, url }).catch(() => {}); return; }
  try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); } catch { prompt('Скопируйте ссылку', url); }
};

// ---------- оценки ----------
async function vote(value) {
  const next = game.my_vote === value ? 0 : value; // повторное нажатие снимает оценку
  try {
    const r = await fetch(`/api/games/${game.id}/vote`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ value: next }),
    });
    if (!r.ok) throw new Error();
    Object.assign(game, await r.json());
    renderScore();
  } catch { toast('Не удалось сохранить оценку'); }
}
$('like').onclick = () => vote(1);
$('dislike').onclick = () => vote(-1);

load();
</script>
</body>
</html>
