<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Перекуп: от хлама до клада</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-case" viewBox="0 0 24 24"><path d="M9 3h6a2 2 0 0 1 2 2v1h2.5A2.5 2.5 0 0 1 22 8.5V12H2V8.5A2.5 2.5 0 0 1 4.5 6H7V5a2 2 0 0 1 2-2Zm0 3h6V5H9v1Zm-7 7.5h8V15a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-1.5h8v5A2.5 2.5 0 0 1 19.5 21h-15A2.5 2.5 0 0 1 2 18.5v-5Z"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.2 6.6 11 2.7a2.2 2.2 0 0 1 2 0l7.8 3.9L12 11 3.2 6.6ZM2.5 8.3l8.5 4.3V22l-7.3-3.7A2.2 2.2 0 0 1 2.5 16.3v-8Zm19 0v8a2.2 2.2 0 0 1-1.2 2L13 22v-9.4l8.5-4.3Z"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h6.3a2 2 0 0 1 1.4.6l8.6 8.6a2 2 0 0 1 0 2.8l-6.3 6.3a2 2 0 0 1-2.8 0L3.6 12.7a2 2 0 0 1-.6-1.4V4.5Zm4.5 1.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M12 3c5.2 0 9.5 3.6 9.5 8.2S17.2 19.4 12 19.4c-.9 0-1.8-.1-2.6-.3L5 21.2c-.6.3-1.2-.3-1-.9l1-3.3C3.5 15.5 2.5 13.4 2.5 11.2 2.5 6.6 6.8 3 12 3Z"/></symbol>
    <symbol id="i-pc" viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5.5l.7 2.5H17a1 1 0 1 1 0 2H7a1 1 0 1 1 0-2h1.8l.7-2.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v10h16V5H4Z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F5B731"/><circle cx="12" cy="12" r="7" fill="none" stroke="#9A6A00" stroke-width="1.6"/><path d="M10 7.5h3a2.6 2.6 0 0 1 0 5.2h-3V7.5Zm0 5.2V16.5M8.6 14.6h4.2" fill="none" stroke="#7A5200" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 1 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6Zm6 2.3v7.4a.8.8 0 0 0 1.2.7l5.6-3.7a.8.8 0 0 0 0-1.4l-5.6-3.7a.8.8 0 0 0-1.2.7Z"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="bar">
    <button class="back hidden" id="back" type="button" aria-label="Назад"><svg><use href="#i-back"/></svg></button>
    <h1 class="title" id="title">Кейсы</h1>
    <span class="bal" id="bal"><svg aria-hidden="true"><use href="#i-coin"/></svg><b id="money">0 ₽</b></span>
  </header>

  <main class="view" id="view"></main>

  <nav class="nav" id="nav">
    <button type="button" data-tab="inv"><svg><use href="#i-box"/></svg><span>Инвентарь</span></button>
    <button type="button" data-tab="sales"><svg><use href="#i-tag"/></svg><span>Продажи</span></button>
    <button type="button" data-tab="cases" class="center"><span class="k"><svg><use href="#i-case"/></svg></span><span>Кейсы</span></button>
    <button type="button" data-tab="chats"><svg><use href="#i-chat"/></svg><span>Переписки</span><i class="dot hidden" id="chatDot"></i></button>
    <button type="button" data-tab="work"><svg><use href="#i-pc"/></svg><span>Работа</span></button>
  </nav>

  <div class="toast hidden" id="toast" role="status"></div>
</div>

<script src="/sdk/v1.js"></script>
<script src="js/items.js"></script>
<script src="js/economy.js"></script>
<script src="js/talk.js"></script>
<script src="js/game.js"></script>
</body>
</html>
