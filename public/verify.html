<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подтверждение почты — Игродром</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w top-in">
  <a class="logo" href="index.html" aria-label="Игродром, на главную"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1C2140"/><circle cx="16" cy="16" r="10.5" fill="#FFC531"/><path d="M13.2 10.9 21.6 16l-8.4 5.1z" fill="#1C2140"/></svg><span>Игродром</span></a>
  <form class="search" id="searchForm" action="index.html" role="search">
    <input id="q" name="q" type="search" placeholder="Найти игру…" autocomplete="off" aria-label="Поиск игр">
  </form>
  <a class="btn" id="login" href="login.html">Войти</a>
</div></header>

<main class="w"><div class="narrow panel" role="status">
  <h1 class="auth-title" id="title">Подтверждаем почту…</h1>
  <p class="mut auth-sub" id="text"></p>
  <a class="btn primary hidden" id="next" href="index.html">Выбрать игру</a>
</div></main>

<footer><div class="w">
  <nav><a href="index.html">Каталог игр</a><a href="developers.html">Разработчикам</a><a href="cabinet.html">Кабинет разработчика</a><a href="terms.html">Правила</a><a href="privacy.html">Конфиденциальность</a><a href="contacts.html">Контакты</a></nav>
  <div>© Игродром</div>
</div></footer>

<script src="app.js"></script>
<script>
const { $ } = Igr;
const token = new URLSearchParams(location.search).get('token');
if (token) history.replaceState(null, '', 'verify.html');

function show(title, text, link) {
  $('title').textContent = title;
  $('text').textContent = text;
  if (link) { $('next').textContent = link.text; $('next').href = link.href; }
  $('next').classList.remove('hidden');
}

(async () => {
  if (!token) return show('Нет ссылки', 'Откройте ссылку из письма целиком. Отправить письмо ещё раз можно в профиле.', { text: 'Открыть профиль', href: 'account.html' });
  try {
    const r = await fetch('/api/email/verify', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Сервер недоступен');
    show('Почта подтверждена', 'Спасибо! Теперь можно писать отзывы и подать заявку разработчика.');
  } catch (err) {
    show('Не получилось', err.message, { text: 'Открыть профиль', href: 'account.html' });
  }
})();
Igr.initHeader();
</script>
</body>
</html>
