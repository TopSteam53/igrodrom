<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#2a2f6b 0%,#161a3a 50%,#0f1226 100%);color:#eef0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#top{width:var(--s);height:var(--h);display:flex;align-items:center;gap:calc(var(--h)*.12);margin-bottom:8px}
h1{margin:0 auto 0 0;font-size:calc(var(--h)*.62);font-weight:900;line-height:1;letter-spacing:-.02em;background:linear-gradient(135deg,#ffe066,#ff7a3d 60%,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{position:relative;background:#232a5a;border-radius:10px;padding:0 10px;height:100%;min-width:calc(var(--h)*1.45);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.box small{font-size:calc(var(--h)*.2);color:#a3abe0;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.box b{font-size:calc(var(--h)*.36);line-height:1.1;font-variant-numeric:tabular-nums}
.plus{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:800;color:#ffd23f;font-size:calc(var(--h)*.3);pointer-events:none;animation:rise .7s ease-out forwards}
@keyframes rise{to{top:-25%;opacity:0}}
button{font:inherit;cursor:pointer;border:0;color:#fff}
#newBtn{height:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#ff7a3d,#ff3d7f);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#newBtn svg{width:50%;height:50%}
#board{position:relative;width:var(--s);height:var(--s);background:#1e2450;border-radius:calc(var(--s)*.035);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 2px #2b3270}
.cell,.tile{position:absolute;left:0;top:0;width:var(--t);height:var(--t)}
.cell{background:#2a3164;border-radius:calc(var(--t)*.12)}
.tile{transition:transform .1s ease-in-out;will-change:transform}
.tile.top{z-index:2}
.in{width:100%;height:100%;border-radius:calc(var(--t)*.12);display:flex;align-items:center;justify-content:center;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.new .in{animation:appear .18s ease-out .09s backwards}
.pop .in{animation:pop .2s ease-out}
@keyframes appear{from{transform:scale(0);opacity:0}}
@keyframes pop{50%{transform:scale(1.16)}}
#ov{position:absolute;inset:0;border-radius:inherit;background:rgba(12,14,34,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*.035);z-index:5;text-align:center;animation:fade .3s}
#ov.show{display:flex}
@keyframes fade{from{opacity:0}}
#ovT{font-size:calc(var(--s)*.1);font-weight:900}
#ovS{font-size:calc(var(--s)*.05);color:#c4cbff}
#ov .btns{display:flex;gap:10px}
#ov button{padding:calc(var(--s)*.025) calc(var(--s)*.06);border-radius:999px;font-size:calc(var(--s)*.05);font-weight:800;background:linear-gradient(135deg,#ff7a3d,#ff3d7f);box-shadow:0 4px 0 #a3204f}
#ov button.alt{background:#3a4290;box-shadow:0 4px 0 #23295e}
#hint{margin-top:6px;font-size:12px;color:#7d86c4;height:16px}
</style>
</head>
<body>
<div id="top">
  <h1>2048</h1>
  <div class="box" id="scoreBox"><small>Счёт</small><b id="score">0</b></div>
  <div class="box"><small>Рекорд</small><b id="best">0</b></div>
  <button id="newBtn" title="Новая игра" aria-label="Новая игра"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
</div>
<div id="board">
  <div id="ov"><div id="ovT"></div><div id="ovS"></div><div class="btns"><button id="contBtn" class="alt">Продолжить</button><button id="againBtn">Ещё раз</button></div></div>
</div>
<div id="hint">Стрелки, WASD или свайп</div>
<script>
(function(){
'use strict';
var N=4,root=document.documentElement,board=document.getElementById('board');
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),scoreBox=document.getElementById('scoreBox');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovS=document.getElementById('ovS'),contBtn=document.getElementById('contBtn');
var mem={};
function sget(k){try{var v=window.localStorage.getItem(k);return v==null?(mem[k]||null):v}catch(e){return mem[k]||null}}
function sset(k,v){mem[k]=v;try{window.localStorage.setItem(k,v)}catch(e){}}
var COLORS={2:['#eef1ff','#2b3170'],4:['#cfd7ff','#2b3170'],8:['#ffb347','#fff'],16:['#ff8c42','#fff'],32:['#ff6159','#fff'],64:['#ff2e5b','#fff'],128:['#ffd23f','#5a3a00'],256:['#ffc312','#5a3a00'],512:['#5be37d','#08391a'],1024:['#2ed3d3','#053a3d'],2048:['#b56bff','#fff']};
var grid,score,best=+(sget('2048-best')||0),won,keep,over,pending=null,size=300,tsz=60,gap=8;

function layout(){
  var W=window.innerWidth,H=window.innerHeight;
  var h=Math.round(Math.max(40,Math.min(64,H*.1)));
  var s=Math.floor(Math.min(W-16,H-h-8-22-16,720));
  s=Math.max(200,s);
  gap=Math.round(s*.03);tsz=(s-gap*(N+1))/N;size=s;
  root.style.setProperty('--s',s+'px');root.style.setProperty('--h',h+'px');root.style.setProperty('--t',tsz+'px');
  var cells=board.querySelectorAll('.cell');
  for(var i=0;i<cells.length;i++)cells[i].style.transform=pos(i/N|0,i%N);
  if(grid)grid.forEach(function(t){if(t){place(t);style(t)}});
}
function pos(r,c){return 'translate('+(gap+c*(tsz+gap))+'px,'+(gap+r*(tsz+gap))+'px)'}
function place(t){t.el.style.transform=pos(t.r,t.c)}
function style(t){
  var col=COLORS[t.v]||['#ff4fd8','#fff'],d=String(t.v).length;
  var inn=t.el.firstChild;inn.textContent=t.v;inn.style.background=col[0];inn.style.color=col[1];
  inn.style.fontSize=(tsz*(d<3?.5:d<4?.4:d<5?.31:.25))+'px';
  inn.style.boxShadow=t.v>=128?'inset 0 -4px 0 rgba(0,0,0,.18),0 0 '+(tsz*.25)+'px '+col[0]+'88':'';
}
function makeTile(r,c,v,isNew){
  var el=document.createElement('div');el.className='tile'+(isNew?' new':'');
  el.appendChild(document.createElement('div')).className='in';
  var t={r:r,c:c,v:v,el:el};place(t);style(t);board.appendChild(el);return t;
}
function addRandom(){
  var e=[];for(var i=0;i<N*N;i++)if(!grid[i])e.push(i);
  if(!e.length)return;var i2=e[Math.random()*e.length|0];
  grid[i2]=makeTile(i2/N|0,i2%N,Math.random()<.9?2:4,true);
}
function flush(){if(pending){clearTimeout(pending.id);pending.fn();pending=null}}
function newGame(){
  flush();
  board.querySelectorAll('.tile').forEach(function(e){e.remove()});
  grid=new Array(N*N).fill(null);score=0;won=false;keep=false;over=false;
  addRandom();addRandom();updScore(0);hideOv();
}
function updScore(add){
  scoreEl.textContent=score;
  if(score>best){best=score;sset('2048-best',String(best))}
  bestEl.textContent=best;
  if(add>0){var p=document.createElement('div');p.className='plus';p.textContent='+'+add;scoreBox.appendChild(p);setTimeout(function(){p.remove()},700)}
}
function canMove(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var t=grid[r*N+c];if(!t)return true;
    if(c<N-1&&grid[r*N+c+1]&&grid[r*N+c+1].v===t.v)return true;
    if(r<N-1&&grid[(r+1)*N+c]&&grid[(r+1)*N+c].v===t.v)return true;
  }return false;
}
var DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
function move(d){
  if(over||ov.classList.contains('show'))return;
  flush();
  var dr=DIRS[d][0],dc=DIRS[d][1],rows=[0,1,2,3],cols=[0,1,2,3];
  if(dr===1)rows.reverse();if(dc===1)cols.reverse();
  var moved=false,gone=[],merged=[],add=0;
  rows.forEach(function(r){cols.forEach(function(c){
    var t=grid[r*N+c];if(!t)return;
    var rr=r,cc=c;
    while(true){var nr=rr+dr,nc=cc+dc;if(nr<0||nr>=N||nc<0||nc>=N||grid[nr*N+nc])break;rr=nr;cc=nc}
    var nr2=rr+dr,nc2=cc+dc,nx=(nr2>=0&&nr2<N&&nc2>=0&&nc2<N)?grid[nr2*N+nc2]:null;
    grid[r*N+c]=null;
    if(nx&&nx.v===t.v&&merged.indexOf(nx)<0){
      nx.v*=2;add+=nx.v;merged.push(nx);gone.push(t);t.r=nr2;t.c=nc2;nx.el.classList.add('top');moved=true;
      if(nx.v===2048&&!won&&!keep)won=true;
    }else{
      grid[rr*N+cc]=t;if(rr!==r||cc!==c){t.r=rr;t.c=cc;moved=true}
    }
    place(t);
  })});
  if(!moved)return;
  score+=add;
  addRandom();
  var fn=function(){
    gone.forEach(function(t){t.el.remove()});
    merged.forEach(function(t){style(t);t.el.classList.remove('top','pop');void t.el.offsetWidth;t.el.classList.add('pop')});
  };
  pending={fn:fn,id:setTimeout(function(){pending=null;fn()},100)};
  updScore(add);
  if(won&&!keep){keep=true;setTimeout(function(){showOv('Победа!','Вы собрали 2048. Счёт: '+score,true)},250)}
  else if(!canMove()){over=true;setTimeout(function(){showOv('Ходов нет','Счёт: '+score+(score>=best&&score>0?' — новый рекорд!':''),false)},350)}
}
function showOv(t,s,cont){ovT.textContent=t;ovS.textContent=s;contBtn.style.display=cont?'':'none';ov.classList.add('show')}
function hideOv(){ov.classList.remove('show')}
document.getElementById('againBtn').addEventListener('click',newGame);
contBtn.addEventListener('click',hideOv);
document.getElementById('newBtn').addEventListener('click',function(e){newGame();e.currentTarget.blur()});

var KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
window.addEventListener('keydown',function(e){
  var d=KEYS[e.code];if(d===undefined)d=KEYS[e.key];
  if(d!==undefined){e.preventDefault();move(d)}
  else if(e.code==='KeyR'||e.code==='KeyN'){newGame()}
  else if((e.code==='Enter'||e.code==='Space')&&ov.classList.contains('show')){e.preventDefault();if(over)newGame();else hideOv()}
});
var sx=null,sy=0,pid=null;
document.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;pid=e.pointerId});
document.addEventListener('pointerup',function(e){
  if(sx===null||e.pointerId!==pid)return;
  var dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);sx=null;
  if(Math.max(ax,ay)<Math.max(20,size*.06))return;
  move(ax>ay?(dx>0?1:3):(dy>0?2:0));
});
document.addEventListener('pointercancel',function(){sx=null});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

for(var i=0;i<N*N;i++){var c=document.createElement('div');c.className='cell';board.insertBefore(c,ov)}
window.addEventListener('resize',layout);
layout();newGame();
try{window.focus()}catch(e){}
window.__game={get score(){return score},get board(){return grid.map(function(t){return t?t.v:0})}};
})();
</script>
</body>
</html>
