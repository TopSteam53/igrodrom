<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игра — Gamely</title>
<meta name="color-scheme" content="light dark">
<script src="theme.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w top-in">
  <a class="logo" href="index.html" aria-label="Gamely, на главную"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FFC531"/><path d="M22.6 9.4A9 9 0 1 0 25 16" fill="none" stroke="#1C2140" stroke-width="4.2" stroke-linecap="round"/><path d="M14.6 12.2 21.2 16l-6.6 3.8z" fill="#1C2140" stroke="#1C2140" stroke-width="1.4" stroke-linejoin="round"/></svg><span>Gamely</span></a>
  <form class="search" id="searchForm" action="index.html" role="search">
    <input id="q" name="q" type="search" placeholder="Найти игру…" autocomplete="off" aria-label="Поиск игр">
  </form>
  <a class="btn" id="login" href="login.html">Войти</a>
</div></header>

<main class="w" id="page">
  <div class="empty" id="loading">Загрузка…</div>

  <article id="game" class="hidden">
    <div class="game-head">
      <div id="icon"></div>
      <div>
        <h1 id="title"></h1>
        <div class="game-sub"><span id="author"></span><a id="category"></a><span id="score"></span></div>
      </div>
    </div>

    <div class="player" id="player">
      <div class="splash" id="splash">
        <div class="splash-bg" id="splashBg"></div>
        <div class="splash-in">
          <div id="splashIcon"></div>
          <p class="splash-title" id="splashTitle"></p>
          <p class="splash-meta" id="splashMeta"></p>
          <button class="btn play-btn" id="play">Играть</button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <span id="votes" class="hidden">
        <button class="btn sm" id="like" aria-pressed="false" title="Нравится">👍 <span id="likes">0</span></button>
        <button class="btn sm" id="dislike" aria-pressed="false" title="Не нравится">👎 <span id="dislikes">0</span></button>
      </span>
      <button class="btn sm hidden" id="thank" title="Отдать автору свои монетки — он увидит это в статистике">Поблагодарить автора</button>
      <span class="spacer"></span>
      <button class="btn sm" id="share">Поделиться</button>
      <button class="btn sm" id="full">Во весь экран</button>
    </div>

    <p class="save-hint hidden" id="saveHint"></p>
    <aside class="ad-banner hidden" id="adBanner" aria-label="Реклама"></aside>

    <div class="info">
      <div class="panel">
        <div class="gallery hidden" id="shots" aria-label="Скриншоты"></div>
        <h3>Об игре</h3><p id="desc"></p>
        <div class="tag-list hidden" id="tags"></div>
        <h3>Как играть</h3><p id="howto"></p>
        <div class="hidden" id="news"><h3>Что нового<span class="mut" id="newsVer"></span></h3><p id="changelog"></p></div>
      </div>
      <div class="side">
        <div class="panel">
          <h3>Информация</h3>
          <dl class="facts" id="facts"></dl>
        </div>
        <div class="panel hidden" id="lbPanel">
          <h3>Рекорды</h3>
          <div class="lb-boards hidden" id="lbBoards" role="tablist" aria-label="Таблицы рекордов"></div>
          <ol class="lb" id="lb"></ol>
          <p class="mut hidden" id="lbNote" style="margin:10px 0 0"></p>
        </div>
      </div>
    </div>

    <section class="sec hidden" id="reviewsSec">
      <div class="sec-head"><h2>Отзывы <span class="mut" id="reviewCount"></span></h2></div>
      <div id="reviewForm"></div>
      <div class="reviews" id="reviews"></div>
    </section>

    <section class="sec"><div class="sec-head"><h2>Похожие игры</h2></div><div class="row-scroll" id="similar"></div></section>
  </article>
</main>

<footer><div class="w">
  <nav><a href="index.html">Каталог игр</a><a href="developers.html">Разработчикам</a><a href="cabinet.html">Кабинет разработчика</a><a href="terms.html">Правила</a><a href="privacy.html">Конфиденциальность</a><a href="contacts.html">Контакты</a></nav>
  <div>© Gamely</div>
</div></footer>

<script src="app.js"></script>
<script src="ads.js"></script>
<script src="sdk-host.js"></script>
<script>
const { $, esc, fmt, loadCatalog, rating, cardHTML, iconHTML, initHeader, toast } = Igr;
// /game/<slug>: номер игры кладёт в страницу сервер; старый адрес — game.html?id=…
const id = new URLSearchParams(location.search).get('id') || document.querySelector('meta[name="gamely-game"]')?.content;
initHeader();

let game, live;

function notFound() {
  $('loading').innerHTML = `<h1 class="empty-title">Такой игры нет в каталоге</h1>
    <p>Возможно, её сняли с публикации или в ссылке опечатка.</p><a class="btn primary" href="index.html">Открыть каталог</a>`;
}

async function load() {
  const cat = await loadCatalog();
  live = cat.live;
  game = cat.games.find((g) => g.id === id);
  if (!game) return notFound();
  if (live) {
    // Полная карточка: описание, правила, своя оценка.
    try {
      const r = await fetch(`/api/games/${encodeURIComponent(id)}`);
      if (r.ok) game = { ...game, ...(await r.json()).game };
    } catch {}
  }
  render(cat.games);
}

function render(all) {
  document.title = `${game.title} — играть онлайн бесплатно | Gamely`;
  $('loading').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('icon').innerHTML = iconHTML(game);
  $('title').textContent = game.title;
  $('author').innerHTML = game.author && game.author_id && !game.demo
    ? `<a href="${Igr.devUrl(game.author_id)}">${esc(game.author)}</a>` : esc(game.author || '');
  $('category').textContent = game.genre;
  $('category').href = Igr.catUrl(game.genre);
  // Заставка: размытая обложка фоном, поверх — иконка, название и «Играть».
  if (game.cover_url) $('splashBg').innerHTML = `<img src="${esc(game.cover_url)}" alt="" onerror="this.remove()">`;
  $('splashIcon').innerHTML = iconHTML(game, 'game-icon big');
  $('splashTitle').textContent = game.title;
  const r0 = rating(game);
  $('splashMeta').innerHTML = `<span>${esc(game.genre)}</span><span class="age">${esc(game.age || '0+')}</span>${r0 !== null ? `<span>👍 ${r0}%</span>` : ''}`;
  $('desc').textContent = game.description || 'Описание пока не добавлено.';
  $('howto').textContent = game.how_to_play || 'Правила пока не добавлены.';
  renderExtras();
  renderScore();

  const named = (list, dict) => (list || []).map((v) => dict[v]).filter(Boolean).join(', ');
  const facts = [
    ['Категория', esc(game.genre)],
    ['Возраст', esc(game.age || '0+')],
    ['Разработчик', $('author').innerHTML || '—'],
    ['Платформы', named(game.platforms, PLATFORMS) || 'Компьютер, телефон, планшет'],
    game.controls?.length ? ['Управление', named(game.controls, CONTROLS)] : null,
    game.orientation && game.orientation !== 'any' ? ['Экран', ORIENT[game.orientation]] : null,
    game.languages?.length ? ['Языки', named(game.languages, LANGS)] : null,
    game.version ? ['Версия', esc(game.version)] : null,
    live && game.created_at ? ['Добавлена', new Date(game.created_at).toLocaleDateString('ru-RU')] : null,
    live && game.updated_at && game.updated_at - game.created_at > 864e5 ? ['Обновлена', new Date(game.updated_at).toLocaleDateString('ru-RU')] : null,
    live ? ['Запусков', fmt(game.plays || 0)] : null,
    game.support ? ['Поддержка', supportHTML(game.support)] : null,
  ].filter(Boolean);
  $('facts').innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  const others = all.filter((g) => g.id !== game.id);
  const similar = [...others.filter((g) => g.genre === game.genre), ...others.filter((g) => g.genre !== game.genre)].slice(0, 10);
  $('similar').innerHTML = similar.map(cardHTML).join('');
  $('votes').classList.toggle('hidden', !live);
  // «Поблагодарить автора» — у игр сторонних авторов; свою игру благодарить нельзя.
  if (live && !game.demo && game.author_id) {
    Igr.me().then((u) => $('thank').classList.toggle('hidden', !!u && u.id === game.author_id));
  }
  // Баннер под игрой — только если сеть настроена на сервере и у игрока нет дня без рекламы.
  (live ? Igr.me() : Promise.resolve(null)).then((u) => {
    if (u) IgrAds.setNoAds(u.noAdsUntil);
    return IgrAds.banner($('adBanner'));
  }).then((placed) => {
    $('adBanner').classList.toggle('hidden', !placed);
    if (placed) countAd('banner');
  });
  // «Играть» из подборки на главной: запускаем сразу, без второго нажатия.
  const qs = new URLSearchParams(location.search);
  if (qs.get('play') === '1') {
    qs.delete('play');
    history.replaceState(null, '', location.pathname + (qs.toString() ? `?${qs}` : ''));
    $('play').click();
  }
  // Гостю — подсказка: прогресс сейчас живёт только в этом браузере.
  if (live) Igr.me().then((user) => {
    if (user) return;
    $('saveHint').innerHTML = `Прогресс сохраняется в этом браузере. <a href="${loginUrl()}">Войдите</a>, чтобы он был доступен на всех ваших устройствах. Новичкам дарим 50 монеток.`;
    $('saveHint').classList.remove('hidden');
  });
  if (live) { loadBoard(); loadReviews(); }
}

const loginUrl = () => `login.html?next=${encodeURIComponent(Igr.gameUrl(game))}`;

const PLATFORMS = { desktop: 'Компьютер', mobile: 'Телефон и планшет', tv: 'Телевизор' };
const CONTROLS = { keyboard: 'Клавиатура', mouse: 'Мышь', touch: 'Сенсорный экран', gamepad: 'Геймпад' };
const ORIENT = { landscape: 'Горизонтальный', portrait: 'Вертикальный' };
const LANGS = { ru: 'русский', en: 'английский', uk: 'украинский', be: 'белорусский', kk: 'казахский', uz: 'узбекский', tr: 'турецкий', de: 'немецкий', es: 'испанский', other: 'другие' };
// Контакт поддержки: почта или Telegram становятся ссылками, остальное — текстом.
function supportHTML(s) {
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return `<a href="mailto:${esc(s)}">${esc(s)}</a>`;
  const tg = s.match(/^(?:@|https:\/\/t\.me\/)([\w]{4,32})$/);
  if (tg) return `<a href="https://t.me/${tg[1]}" target="_blank" rel="noopener nofollow">@${esc(tg[1])}</a>`;
  return esc(s);
}

// Скриншоты, теги и «Что нового» — то, что разработчик заполнил в кабинете.
function renderExtras() {
  const shots = game.screenshots || [];
  $('shots').classList.toggle('hidden', !shots.length);
  $('shots').innerHTML = shots.map((s, i) => `<button type="button" class="gallery-item" data-i="${i}"><img src="${esc(s)}" alt="Скриншот ${i + 1}" loading="lazy"></button>`).join('');
  $('shots').onclick = (e) => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    const img = document.createElement('img');
    img.src = shots[b.dataset.i]; img.alt = ''; img.className = 'shot-full';
    Igr.dialog({ title: `${game.title} — скриншот ${Number(b.dataset.i) + 1} из ${shots.length}`, body: img, buttons: [{ text: 'Закрыть', value: null, cls: 'primary' }] });
  };
  const tags = game.tags || [];
  $('tags').classList.toggle('hidden', !tags.length);
  $('tags').innerHTML = tags.map((t) => `<a class="chip" href="index.html?q=${encodeURIComponent(t)}">#${esc(t)}</a>`).join('');
  $('news').classList.toggle('hidden', !game.changelog);
  $('changelog').textContent = game.changelog || '';
  $('newsVer').textContent = game.version ? ` · версия ${game.version}` : '';
}

function renderScore() {
  const r = rating(game);
  $('score').textContent = r !== null ? `👍 ${r}% из ${fmt(game.likes + game.dislikes)} оценок` : '';
  $('likes').textContent = fmt(game.likes || 0);
  $('dislikes').textContent = fmt(game.dislikes || 0);
  $('like').classList.toggle('on', game.my_vote === 1);
  $('dislike').classList.toggle('on', game.my_vote === -1);
  $('like').setAttribute('aria-pressed', game.my_vote === 1);
  $('dislike').setAttribute('aria-pressed', game.my_vote === -1);
}

// ---------- игра ----------
let session = null;
$('play').onclick = () => {
  const frame = document.createElement('iframe');
  // SDK-хост слушает до загрузки игры, чтобы не пропустить её первое сообщение.
  IgrodromHost.attach(frame, {
    gameId: game.id,
    live,
    ads: IgrAds,
    onAd: countAd,
    // Игре — имя вошедшего игрока и его id для этой игры (почта и id аккаунта игре не передаются).
    player: async () => {
      const user = live ? await Igr.me() : null;
      return user ? { authorized: true, name: user.name, id: await IgrodromHost.playerIdFor(user.id, game.id) } : null;
    },
    onScore: () => { if (live) setTimeout(loadBoard, 300); },
    ...(live && { coins: coinsBridge, feedback: feedbackBridge }),
  });
  frame.src = game.src;
  frame.title = game.title;
  frame.setAttribute('sandbox', 'allow-scripts allow-pointer-lock');
  frame.setAttribute('allow', 'fullscreen; autoplay');
  $('splash').replaceWith(frame);
  frame.focus();
  IgrAds.start();
  if (live) startSession();
};

// Показы рекламы — в статистику автора игры.
function countAd(kind) {
  if (!live) return;
  fetch(`/api/games/${game.id}/ad`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind }) })
    .catch(() => {});
}

// Время считается, только пока вкладка видна.
function startSession() {
  fetch(`/api/games/${game.id}/play`, { method: 'POST' }).catch(() => {});
  Igr.goal('game_start', { game: game.slug || game.id });
  session = { visibleMs: 0, since: document.hidden ? null : Date.now() };
}

// ---------- монетки в играх ----------
// Игра просит потратить монетки через SDK. Подтверждает игрок здесь, на странице площадки.
const coinsBridge = {
  async balance() {
    const r = await fetch('/api/me');
    const { user } = await r.json();
    return user ? user.coins : null;
  },
  async confirm({ amount, title, balance }) {
    const { dialog, coinsText, COIN_SVG } = Igr;
    if (balance == null) {
      await dialog({
        title: 'Нужен вход',
        html: `<p>Игра предлагает «${esc(title)}» за ${coinsText(amount)}. Монетки хранятся в аккаунте: войдите, чтобы ими пользоваться.</p>`,
        buttons: [{ text: 'Не сейчас', value: false }, { text: 'Войти', href: loginUrl(), cls: 'primary', value: false }],
      });
      return false;
    }
    if (balance < amount) {
      await dialog({
        title: 'Не хватает монеток',
        html: `<p>«${esc(title)}» стоит ${coinsText(amount)}, у вас ${coinsText(balance)}.</p>
          <p class="mut">Монетки можно купить в профиле, а ещё каждый день за вход дарим немного бесплатно.</p>`,
        buttons: [{ text: 'Не сейчас', value: false }, { text: 'Купить монетки', href: 'account.html#coins', cls: 'primary', value: false }],
      });
      return false;
    }
    return !!(await dialog({
      title: `Потратить ${coinsText(amount)}?`,
      html: `<p>«${esc(title)}» в игре «${esc(game.title)}».</p>
        <p class="mut" style="display:flex;align-items:center;gap:6px">${COIN_SVG} У вас ${fmt(balance)}, останется ${fmt(balance - amount)}</p>`,
      buttons: [{ text: 'Отмена', value: false }, { text: 'Потратить', value: true, cls: 'primary' }],
    }));
  },
  async spend(amount, title) {
    const r = await fetch(`/api/games/${game.id}/coins/spend`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ amount, title }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || 'Не получилось'); e.status = r.status; throw e; }
    Igr.setCoins(data.coins);
    toast(`Потрачено: ${Igr.coinsText(amount)}`);
    return data.coins;
  },
};

// Игра просит отзыв (ysdk.feedback / sdk.feedback): открываем окно отзыва площадки.
const feedbackBridge = {
  async can() {
    const user = await Igr.me();
    if (!user) return { value: false, reason: 'NO_AUTH' };
    if (reviews.mine) return { value: false, reason: 'GAME_RATED' };
    return { value: true };
  },
  async request() {
    if ((await this.can()).value !== true) return false;
    return reviewDialog();
  },
};

// ---------- рекорды ----------
let boardName = null;
async function loadBoard(name = boardName) {
  try {
    const qs = new URLSearchParams({ top: 10, around: 1, ...(name && { board: name }) });
    const r = await (await fetch(`/api/games/${game.id}/leaderboard?${qs}`)).json();
    if (!r.total) return;
    boardName = r.board;
    $('lbPanel').classList.remove('hidden');
    $('lbBoards').classList.toggle('hidden', r.boards.length < 2);
    $('lbBoards').innerHTML = r.boards.map((b) =>
      `<button class="tab ${b.board === r.board ? 'on' : ''}" role="tab" aria-selected="${b.board === r.board}" data-board="${esc(b.board)}">${esc(b.board)}</button>`).join('');
    const row = (e) => `<li class="${e.me ? 'me' : ''}"><span class="r">${e.rank}</span><span class="n">${Igr.avatarHTML(e, 24)}${Igr.nameHTML(e)}</span><span class="s">${fmt(e.score)}</span></li>`;
    const mine = r.me && r.me.rank > r.entries.length ? r.around.filter((e) => e.rank > r.entries.length) : [];
    $('lb').innerHTML = r.entries.map(row).join('') +
      (mine.length ? `${mine[0].rank > r.entries.length + 1 ? '<li class="lb-gap" aria-hidden="true">…</li>' : ''}${mine.map(row).join('')}` : '');
    const user = await Igr.me();
    $('lbNote').classList.toggle('hidden', !!user);
    $('lbNote').innerHTML = user ? '' : `<a href="${loginUrl()}">Войдите</a>, чтобы ваш результат попал в таблицу.`;
  } catch {}
}
$('lbBoards').onclick = (e) => { const b = e.target.closest('[data-board]'); if (b) loadBoard(b.dataset.board); };

// ---------- отзывы ----------
// Достижение, которое автор отзыва выбрал в витрине, — тем же значком, что полученные достижения в профиле.
const BADGE_SVG = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle class="mark-fill" cx="10" cy="10" r="9"/><path class="mark-check" d="m6 10.4 2.7 2.7L14.2 7.4"/></svg>';
let reviews = { list: [], mine: null, canModerate: false };
const dateRu = (t) => new Date(t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

async function loadReviews() {
  try {
    const r = await (await fetch(`/api/games/${game.id}/reviews`)).json();
    reviews = { list: r.reviews, mine: r.reviews.find((x) => x.mine) || null, canModerate: r.canModerate };
    renderReviews(r.total);
  } catch {}
}

async function renderReviews(total = reviews.list.length) {
  const user = await Igr.me();
  $('reviewsSec').classList.remove('hidden');
  $('reviewCount').textContent = total ? fmt(total) : '';
  const form = $('reviewForm');
  if (!user) {
    form.innerHTML = `<div class="notice"><p>Поделитесь впечатлением об игре — другим игрокам будет проще выбрать.</p><a class="btn" href="${loginUrl()}">Войти и написать отзыв</a></div>`;
  } else if (!reviews.mine) {
    form.innerHTML = `<form class="review-form" id="rf"><label for="rt" style="margin-top:0">Ваш отзыв</label>
      <textarea id="rt" maxlength="1000" placeholder="Что понравилось, что нет, кому подойдёт игра"></textarea>
      <div class="err-text" id="rErr" role="alert"></div>
      <div class="acts"><span class="count" id="rc">0 / 1000</span><button class="btn primary">Отправить</button></div></form>`;
    $('rt').oninput = () => { $('rc').textContent = `${$('rt').value.length} / 1000`; };
    $('rf').onsubmit = async (e) => {
      e.preventDefault();
      const err = await saveReview($('rt').value);
      $('rErr').textContent = err || '';
    };
  } else form.innerHTML = '';
  $('reviews').innerHTML = reviews.list.length ? reviews.list.map((r) => `<article class="review" data-id="${esc(r.id)}">
      <div class="review-head">${Igr.avatarHTML(r, 32)}${Igr.nameHTML(r, 'b')}${r.badge ? `<span class="p-badge" title="Достижение">${BADGE_SVG}${esc(r.badge)}</span>` : ''}<time datetime="${new Date(r.updated_at).toISOString()}">${dateRu(r.updated_at)}</time>
        <span class="acts">${r.mine ? '<button class="btn sm" data-act="edit">Изменить</button><button class="btn sm" data-act="del">Удалить</button>'
          : reviews.canModerate ? '<button class="btn sm bad" data-act="mod">Удалить</button>' : ''}</span></div>
      <p>${esc(r.text)}</p></article>`).join('')
    : '<p class="mut" style="margin:0">Отзывов пока нет.</p>';
}

async function saveReview(text) {
  const r = await fetch(`/api/games/${game.id}/reviews`, {
    method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) return data.error || 'Не удалось сохранить отзыв';
  toast('Спасибо за отзыв');
  Igr.goal('review', { game: game.slug || game.id });
  await loadReviews();
  return null;
}

// Окно отзыва: для «Изменить» и для просьбы игры через SDK. Возвращает true, если отзыв сохранён.
async function reviewDialog(initial = '') {
  const body = document.createElement('div');
  body.innerHTML = `<label for="rdText" style="margin-top:4px">Что понравилось, что нет, кому подойдёт игра</label>
    <textarea id="rdText" maxlength="1000"></textarea><div class="err-text" id="rdErr" role="alert"></div>`;
  body.querySelector('textarea').value = initial;
  for (;;) {
    const ok = await Igr.dialog({
      title: initial ? 'Изменить отзыв' : `Отзыв об игре «${game.title}»`, body,
      buttons: [{ text: 'Отмена', value: false }, { text: 'Отправить', value: true, cls: 'primary' }],
    });
    if (!ok) return false;
    const err = await saveReview(body.querySelector('textarea').value);
    if (!err) return true;
    body.querySelector('.err-text').textContent = err;
  }
}

$('reviews').onclick = async (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.closest('[data-id]').dataset.id;
  if (btn.dataset.act === 'edit') return reviewDialog(reviews.mine.text);
  const ok = await Igr.dialog({
    title: btn.dataset.act === 'mod' ? 'Удалить чужой отзыв?' : 'Удалить ваш отзыв?',
    html: btn.dataset.act === 'mod' ? '<p class="mut">Решение попадёт в журнал модерации.</p>' : '',
    buttons: [{ text: 'Отмена', value: false }, { text: 'Удалить', value: true, cls: 'bad' }],
  });
  if (!ok) return;
  const url = btn.dataset.act === 'mod' ? `/api/games/${game.id}/reviews/${id}` : `/api/games/${game.id}/reviews`;
  const r = await fetch(url, { method: 'DELETE' });
  if (!r.ok) return toast('Не удалось удалить');
  loadReviews();
};
function endSession() {
  if (!session) return;
  if (session.since) session.visibleMs += Date.now() - session.since;
  navigator.sendBeacon(`/api/games/${game.id}/play-end`,
    new Blob([JSON.stringify({ seconds: Math.round(session.visibleMs / 1000) })], { type: 'application/json' }));
  session = null;
}
document.addEventListener('visibilitychange', () => {
  if (!session) return;
  if (document.hidden && session.since) { session.visibleMs += Date.now() - session.since; session.since = null; }
  if (!document.hidden && !session.since) session.since = Date.now();
});
addEventListener('pagehide', endSession);

$('full').onclick = () => {
  const el = $('player');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast('Браузер не разрешил полноэкранный режим'));
  else toast('Полноэкранный режим не поддерживается');
};

$('share').onclick = async () => {
  const url = location.href;
  if (navigator.share) { navigator.share({ title: game.title, url }).catch(() => {}); return; }
  try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); } catch { prompt('Скопируйте ссылку', url); }
};

// ---------- оценки ----------
async function vote(value) {
  const next = game.my_vote === value ? 0 : value; // повторное нажатие снимает оценку
  try {
    const r = await fetch(`/api/games/${game.id}/vote`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ value: next }),
    });
    if (!r.ok) throw new Error();
    Object.assign(game, await r.json());
    renderScore();
  } catch { toast('Не удалось сохранить оценку'); }
}
$('like').onclick = () => vote(1);
$('dislike').onclick = () => vote(-1);

load();

// ---------- благодарность автору ----------
$('thank').onclick = async () => {
  const user = await Igr.me();
  if (!user) {
    await Igr.dialog({
      title: 'Поблагодарить автора',
      html: '<p>Войдите, чтобы отдать автору свои монетки. Новичкам дарим 50 монеток.</p>',
      buttons: [{ text: 'Не сейчас', value: null }, { text: 'Войти', href: 'login.html?mode=register', cls: 'primary' }],
    });
    return;
  }
  const amount = await Igr.dialog({
    title: 'Поблагодарить автора',
    html: `<p>Сколько монеток отдать автору «${esc(game.title)}»? Он увидит благодарность в статистике игры.
      У вас ${Igr.coinsText(user.coins)}.</p>`,
    buttons: [{ text: 'Отмена', value: null }, ...[5, 10, 25].map((n, i) => ({ text: Igr.coinsText(n), value: n, cls: i === 1 ? 'primary' : '' }))],
  });
  if (!amount) return;
  const r = await fetch(`/api/games/${game.id}/thanks`, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ amount }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) return toast(r.status === 409 ? 'Не хватает монеток' : data.error || 'Не получилось');
  user.coins = data.coins;
  Igr.setCoins(data.coins);
  toast(`Спасибо! Автор получил ${Igr.coinsText(amount)}`);
};
</script>
