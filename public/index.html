<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игродром — бесплатные игры онлайн</title>
<meta name="description" content="Бесплатные браузерные игры без скачивания и регистрации: аркады, головоломки, три в ряд и другие.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w top-in">
  <a class="logo" href="index.html">Игро<b>дром</b></a>
  <form class="search" id="searchForm" action="index.html" role="search">
    <input id="q" name="q" type="search" placeholder="Найти игру…" autocomplete="off" aria-label="Поиск игр">
  </form>
  <a class="btn g" id="login" href="cabinet.html">Войти</a>
</div></header>
<div class="static-note hidden" id="staticNote"><div class="w">Демо-версия без сервера: оценки, счётчики и кабинет авторов работают в полной версии.</div></div>

<main class="w">
  <nav class="chips" id="chips" aria-label="Категории"></nav>

  <!-- Подборки появляются, когда для них есть данные; пока игр мало, главная — одна сетка, как у Яндекс Игр. -->
  <div id="home">
    <section class="sec hidden" id="popularSec"><div class="sec-head"><h2>Популярные</h2></div><div class="row-scroll" id="popular"></div></section>
    <section class="sec hidden" id="freshSec"><div class="sec-head"><h2>Новые игры</h2></div><div class="row-scroll" id="fresh"></div></section>
  </div>

  <section class="sec" id="all">
    <div class="sec-head">
      <h2 id="allTitle">Все игры</h2>
      <select id="sort" aria-label="Сортировка">
        <option value="popular">Популярные</option>
        <option value="new">Новые</option>
        <option value="rating">По оценкам</option>
        <option value="title">По названию</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer><div class="w">
  <nav><a href="index.html">Каталог игр</a><a href="developers.html">Разработчикам</a><a href="cabinet.html">Кабинет автора</a></nav>
  <div>© Игродром</div>
</div></footer>

<script src="app.js"></script>
<script>
const { $, esc, loadCatalog, rating, isNew, cardHTML, initHeader, matches, CATEGORY_ICONS } = Igr;
const params = new URLSearchParams(location.search);
let state = { q: params.get('q') || '', cat: params.get('category') || '', sort: 'popular' };
let games = [];

const SORTS = {
  popular: (a, b) => b.plays - a.plays || (rating(b) ?? -1) - (rating(a) ?? -1) || b.created_at - a.created_at,
  new: (a, b) => (b.created_at || 0) - (a.created_at || 0),
  rating: (a, b) => (rating(b) ?? -1) - (rating(a) ?? -1) || b.likes - a.likes,
  title: (a, b) => a.title.localeCompare(b.title, 'ru'),
};

function render() {
  // Категории — только те, в которых есть игры.
  const cats = [...new Set(games.map((g) => g.genre))].sort((a, b) => a.localeCompare(b, 'ru'));
  $('chips').innerHTML = [`<a class="chip ${state.cat ? '' : 'on'}" href="index.html" data-cat="">Все игры</a>`,
    ...cats.map((c) => `<a class="chip ${c === state.cat ? 'on' : ''}" href="index.html?category=${encodeURIComponent(c)}" data-cat="${esc(c)}">${CATEGORY_ICONS[c] || '🎮'} ${esc(c)}</a>`)].join('');

  const filtering = state.q || state.cat;
  $('home').classList.toggle('hidden', !!filtering);
  if (!filtering) {
    const played = games.filter((g) => g.plays > 0);
    const showPopular = games.length >= 8 && played.length >= 4;
    $('popularSec').classList.toggle('hidden', !showPopular);
    if (showPopular) $('popular').innerHTML = played.sort(SORTS.popular).slice(0, 10).map(cardHTML).join('');
    const fresh = games.filter(isNew);
    $('freshSec').classList.toggle('hidden', fresh.length < 3);
    if (fresh.length >= 3) $('fresh').innerHTML = fresh.sort(SORTS.new).slice(0, 10).map(cardHTML).join('');
  }

  const list = games.filter((g) => (!state.cat || g.genre === state.cat) && matches(g, state.q)).sort(SORTS[state.sort]);
  $('allTitle').textContent = state.q ? `Поиск: «${state.q}»` : state.cat || 'Все игры';
  document.title = state.q || state.cat ? `${state.q ? `«${state.q}»` : state.cat} — Игродром` : 'Игродром — бесплатные игры онлайн';
  $('grid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<p class="empty">Ничего не нашлось. Попробуйте другое название или <a href="index.html">посмотрите все игры</a>.</p>`;
}

function setState(patch) {
  state = { ...state, ...patch };
  const qs = new URLSearchParams();
  if (state.q) qs.set('q', state.q);
  if (state.cat) qs.set('category', state.cat);
  history.replaceState(null, '', qs.toString() ? `?${qs}` : location.pathname);
  render();
}

$('chips').onclick = (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  e.preventDefault();
  setState({ cat: chip.dataset.cat });
};
$('sort').onchange = () => setState({ sort: $('sort').value });
initHeader({ onSearch: (q) => setState({ q }) });

loadCatalog().then(({ live, games: list }) => {
  games = list;
  if (!live) $('staticNote').classList.remove('hidden');
  render();
});
</script>
</body>
</html>
