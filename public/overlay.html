<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Плашка Gamely для стрима</title>
<!-- Источник «Браузер» в OBS: 1920×1080, фон прозрачный. ?code=ПРОМОКОД, ?pos=br|bl|tr|tl (угол), ?scale=0.5…2. -->
<style>
  @font-face{font-family:Onest;font-weight:400 700;font-display:block;src:url(fonts/onest-cyrillic.woff2) format("woff2");unicode-range:U+0400-045F}
  @font-face{font-family:Onest;font-weight:400 700;font-display:block;src:url(fonts/onest-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:Unbounded;font-weight:500 800;font-display:block;src:url(fonts/unbounded-cyrillic.woff2) format("woff2");unicode-range:U+0400-045F}
  @font-face{font-family:Unbounded;font-weight:500 800;font-display:block;src:url(fonts/unbounded-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
  .plate{position:fixed;display:flex;align-items:center;gap:22px;padding:20px 22px;border-radius:30px;background:rgba(18,22,43,.94);
    box-shadow:0 10px 30px rgba(0,0,0,.45);color:#fff;font-family:Onest,sans-serif;transform-origin:var(--origin);
    animation:enter .9s cubic-bezier(.2,.9,.25,1.15) both;scale:var(--scale,1)}
  .br{right:48px;bottom:48px;--origin:100% 100%;--from:translateX(130%)}
  .bl{left:48px;bottom:48px;--origin:0 100%;--from:translateX(-130%)}
  .tr{right:48px;top:48px;--origin:100% 0;--from:translateX(130%)}
  .tl{left:48px;top:48px;--origin:0 0;--from:translateX(-130%)}
  .logo{width:104px;height:104px;flex:none;animation:bob 4s ease-in-out 1s infinite}
  .t b{display:block;font:800 36px/1.1 Unbounded,sans-serif}
  .t span{display:block;margin-top:8px;font:700 31px/1 Onest,sans-serif;color:#FFC531}
  .promo{position:relative;overflow:hidden;background:#FFC531;color:#1C2140;border-radius:20px;padding:12px 26px;text-align:center;min-width:170px}
  .promo small{display:block;font:700 16px Onest,sans-serif;letter-spacing:.06em}
  .promo b{display:block;font:800 42px/1.15 Unbounded,sans-serif}
  .promo i{display:block;font:700 15px Onest,sans-serif;font-style:normal;opacity:.8}
  /* Блик по промокоду раз в несколько секунд — заметно, но не мельтешит. */
  .promo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);
    transform:translateX(-120%);animation:shine 6s ease-in-out 1.5s infinite}
  @keyframes enter{from{transform:var(--from);opacity:0}to{transform:none;opacity:1}}
  @keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  @keyframes bob{0%,100%{transform:none}50%{transform:translateY(-5px) rotate(-3deg)}}
  @media(prefers-reduced-motion:reduce){.plate,.logo,.promo::after{animation:none}}
</style>
</head>
<body>
<div class="plate br" id="plate">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FFC531"/><path d="M22.6 9.4A9 9 0 1 0 25 16" fill="none" stroke="#1C2140" stroke-width="4.2" stroke-linecap="round"/><path d="M14.6 12.2 21.2 16l-6.6 3.8z" fill="#1C2140" stroke="#1C2140" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div class="t"><b>Играй бесплатно</b><span>playgamely.ru</span></div>
  <div class="promo" id="promo"><small>ПРОМОКОД</small><b id="code"></b><i>+100 монеток</i></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const code = (q.get('code') || '').trim().toUpperCase().slice(0, 24);
  if (/^[A-ZА-ЯЁ0-9_-]{2,24}$/.test(code)) document.getElementById('code').textContent = code;
  else document.getElementById('promo').remove();
  const pos = ['br', 'bl', 'tr', 'tl'].includes(q.get('pos')) ? q.get('pos') : 'br';
  const plate = document.getElementById('plate');
  plate.className = `plate ${pos}`;
  const scale = Number(q.get('scale'));
  if (scale >= 0.5 && scale <= 2) plate.style.setProperty('--scale', scale);
</script>
</body>
</html>
