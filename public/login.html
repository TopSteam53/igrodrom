<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Игродром</title>
<meta name="color-scheme" content="light dark">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w top-in">
  <a class="logo" href="index.html" aria-label="Игродром, на главную"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1C2140"/><circle cx="16" cy="16" r="10.5" fill="#FFC531"/><path d="M13.2 10.9 21.6 16l-8.4 5.1z" fill="#1C2140"/></svg><span>Игродром</span></a>
  <form class="search" id="searchForm" action="index.html" role="search">
    <input id="q" name="q" type="search" placeholder="Найти игру…" autocomplete="off" aria-label="Поиск игр">
  </form>
  <a class="btn" id="login" href="login.html">Войти</a>
</div></header>

<main class="w"><div class="narrow panel">
  <h1 class="auth-title" id="title">Вход</h1>
  <p class="mut auth-sub" id="sub">Прогресс в играх сохранится в аккаунте и будет доступен на любом устройстве.</p>
  <div class="tabs" role="tablist"><span class="tab on" data-mode="login">Вход</span><span class="tab" data-mode="register">Регистрация</span></div>
  <form id="form">
    <div id="nameField" class="hidden"><label for="name">Имя</label><input id="name" maxlength="40" autocomplete="nickname"></div>
    <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
    <label for="password">Пароль</label><input id="password" type="password" required minlength="8" autocomplete="current-password">
    <p class="mut hidden" id="passHint">Не короче 8 символов.</p>
    <div class="err-text" id="err" role="alert"></div>
    <button class="btn primary" id="submit" style="width:100%;margin-top:6px">Войти</button>
  </form>
  <p class="mut" style="margin:18px 0 0">Делаете игры? После входа подайте <a href="cabinet.html">заявку на аккаунт разработчика</a>.</p>
</div></main>

<footer><div class="w">
  <nav><a href="index.html">Каталог игр</a><a href="developers.html">Разработчикам</a><a href="cabinet.html">Кабинет разработчика</a></nav>
  <div>© Игродром</div>
</div></footer>

<script src="app.js"></script>
<script>
const { $, me, safeNext } = Igr;
const next = safeNext(new URLSearchParams(location.search).get('next'));
let mode = 'login';

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.mode === mode));
  const reg = mode === 'register';
  $('nameField').classList.toggle('hidden', !reg);
  $('name').required = reg;
  $('passHint').classList.toggle('hidden', !reg);
  $('title').textContent = reg ? 'Регистрация' : 'Вход';
  $('submit').textContent = reg ? 'Создать аккаунт' : 'Войти';
  $('password').autocomplete = reg ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
document.querySelector('.tabs').onclick = (e) => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
if (new URLSearchParams(location.search).get('mode') === 'register') setMode('register');

$('form').onsubmit = async (e) => {
  e.preventDefault();
  $('err').textContent = ''; $('submit').disabled = true;
  const body = { email: $('email').value, password: $('password').value };
  if (mode === 'register') body.name = $('name').value;
  try {
    const r = await fetch(`/api/${mode}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Сервер недоступен. Вход работает только в полной версии сайта.');
    location.replace(next);
  } catch (err) { $('err').textContent = err.message; $('submit').disabled = false; }
};

// Уже вошли — сразу дальше.
me().then((user) => { if (user) location.replace(next); });
Igr.initHeader();
</script>
</body>
</html>
